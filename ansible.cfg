# Ansible configuration for the infra estate.
# roles_path is load-bearing: Ansible resolves roles relative to the playbook's
# own directory, so per-host playbooks would otherwise find no roles.

[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
interpreter_python = auto_silent
forks              = 10

# Never silently act on a host whose key changed.
host_key_checking  = True

[callback_default]
# Readable multi-line output; the supported replacement for the removed `yaml`
# stdout callback.
result_format = yaml

[ssh_connection]
# Saves an SSH round trip per task; safe because no target sets requiretty.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
