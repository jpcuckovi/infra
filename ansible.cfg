# Ansible configuration for the infra estate.
#
# roles_path is the load-bearing line here. Playbooks live in per-host
# directories (playbooks/phantom/main.yml), and Ansible resolves roles relative
# to the playbook's OWN directory — so without this setting it looks in
# playbooks/phantom/roles/, finds nothing, and every role fails to resolve with
# an error that does not mention this file.

[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
interpreter_python = auto_silent
forks              = 10

# Never silently act on a host whose key changed.
host_key_checking  = True

[callback_default]
# Multi-line output (assert messages, diffs, registered results) is unreadable as
# a single JSON line. This is the supported replacement for the old `yaml`
# stdout callback, which no longer ships with ansible-core.
result_format = yaml

[ssh_connection]
# Removes one SSH round trip per task, which matters most against the Pis. Safe
# because no target sets requiretty in sudoers.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
