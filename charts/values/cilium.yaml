# Cilium values every cluster in the estate needs. Addresses, CIDRs and
# per-cluster features (L2 announcements, Gateway API) are passed by roles/cilium.

# k3s is installed with --disable-kube-proxy, which is why roles/cilium must
# name the API server explicitly.
kubeProxyReplacement: true

# clabernetes' VXLAN links bypass socket hooks, so pod traffic must be translated
# per packet. See docs/ARCHITECTURE.md, "revenant's CNI".
socketLB:
  hostNamespaceOnly: true

ipam:
  mode: cluster-pool
  # clusterPoolIPv4PodCIDRList is passed by roles/cilium.

# operator.replicas is passed by roles/cilium: it follows the cluster's size.

# The UI NodePort comes from group_vars/all.yml. Hubble UI has no authentication,
# the same LAN exposure already accepted for Prometheus.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      type: NodePort

# Off: the ServiceMonitors need Prometheus Operator CRDs, which arrive with
# roles/observability after the CNI is up.
prometheus:
  enabled: false

# Off explicitly: ztlab's Envoy sidecars and SPIRE own workload identity.
authentication:
  mutual:
    spire:
      enabled: false

# Rolls the agents on a chart upgrade instead of leaving half-migrated datapath
# state behind.
rollOutCiliumPods: true
