# clabernetes values every cluster needs. The containerd paths and replica count
# differ per cluster and are passed by roles/clabernetes.

globalConfig:
  # "merge" ignores fields already present in the Config, so later edits here
  # would be inert on the cluster; verify.yml asserts the Config carries them.
  mergeMode: overwrite

  imagePull:
    # Pulls through the node's containerd, which already knows registry.lan.
    # "auto" could silently fall back to a direct pull that cannot reach it.
    imagePullThroughMode: always

  deployment:
    # A floor so an undeclared topology is still bounded; cEOS nodes declare
    # far more.
    resourcesDefault:
      requests:
        memory: 512Mi
        cpu: 200m
