# dcgm-exporter: GPU hardware metrics (SM utilisation, VRAM, power, temperature).

# The `nvidia` runtime class is created by k3s when nvidia-container-runtime is
# on PATH at start, not by this repository.
runtimeClassName: nvidia

serviceMonitor:
  enabled: true
  interval: 5s

  # Must be <= interval or Prometheus silently drops the whole job; the chart
  # default is 10s. If an upgrade ignores this, raise interval to >= 10s instead.
  scrapeTimeout: 5s

# Throttle reasons and XID counters are not in the default counter set and need
# a custom counters ConfigMap.
