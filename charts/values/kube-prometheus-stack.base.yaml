# kube-prometheus-stack base values shared by every cluster. Per-host facts
# (ports, storage, retention, cluster identity) are layered on top by
# roles/observability, and the later file wins.

# Changes only the Prometheus CR name; Service names, which external consumers
# address, are unchanged.
cleanPrometheusOperatorObjectNames: true

# Nothing here pages anyone. Default rules stay, since they back the stock
# dashboards and the ALERTS metric remains queryable without Alertmanager.
alertmanager:
  enabled: false

grafana:
  sidecar:
    datasources:
      # Otherwise the chart provisions a permanently broken datasource for the
      # missing Alertmanager Service.
      alertmanager:
        enabled: false

prometheus:
  prometheusSpec:
    # Fine enough to capture the ramp of fast failures such as an OOM climb.
    scrapeInterval: 15s
    # Scrape every monitor in the cluster, not only labelled ones.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    walCompression: true

# kube-state-metrics is deliberately absent: a bare key parses as null, wipes
# the subchart defaults, and silently drops its ServiceMonitor.
