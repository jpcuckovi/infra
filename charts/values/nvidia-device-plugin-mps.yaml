# Device plugin values for MPS sharing, selected when nvidia_gpu_sharing is `mps`.
# Node-wide and sticky, like time slicing.
#
# Requires the node label nvidia.com/mps.capable=true, applied by
# roles/nvidia_device_plugin; without it no MPS daemon runs and pods fail at start.
runtimeClassName: nvidia

config:
  map:
    default: |-
      version: v1
      sharing:
        mps:
          resources:
            - name: nvidia.com/gpu
              replicas: 2
