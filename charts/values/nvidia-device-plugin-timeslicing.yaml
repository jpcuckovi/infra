# Device plugin values that advertise one GPU as two by time slicing, selected
# when nvidia_gpu_sharing is `timeslicing`.
#
# Shares time only: memory is neither partitioned nor isolated, so oversubscribed
# workloads fail with OOM rather than at scheduling. It is node-wide and sticky,
# hence applied only by playbooks/<host>/gpu-sharing.yml, never by a converge.
runtimeClassName: nvidia

config:
  map:
    default: |-
      version: v1
      sharing:
        timeSlicing:
          resources:
            - name: nvidia.com/gpu
              replicas: 2
