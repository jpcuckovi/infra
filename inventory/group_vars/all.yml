# Estate-wide defaults: version pins, DNS role aliases and published ports.
# Per-machine values go in host_vars/; anything a machine reports is a fact.

# ---- role aliases ----------------------------------------------------------
# CNAMEs, not host names, so a service can move without editing its consumers.
registry_alias: registry.lan
metrics_alias: metrics.lan
uptime_kuma_alias: uptime.lan

# Requires a CNAME to the host serving Jaeger. An alias is needed only where
# nothing regenerates the reference, so there is no prometheus_alias.
traces_alias: traces.lan

# ---- published ports -------------------------------------------------------
# Fixed rather than allocated, so bookmarks and the endpoint contract survive
# a reinstall.
registry_port: 5000
prometheus_node_port: 30900
grafana_node_port: 30300
uptime_kuma_node_port: 30001
llama_server_node_port: 30800
victoriametrics_node_port: 30428
jaeger_ui_node_port: 31686
jaeger_otlp_http_node_port: 31318
jaeger_otlp_grpc_node_port: 31317
# The Cilium chart's own default for the Hubble UI.
hubble_ui_node_port: 31235

# ---- version pins ----------------------------------------------------------
# Every pin is deliberate. roles/k3s_server verifies the running version
# against k3s_version, since an install guarded by `creates:` once skipped it.
k3s_version: "v1.36.2+k3s1"
registry_image: "docker.io/library/registry:2"
victoriametrics_image: "victoriametrics/victoria-metrics:v1.111.0"
jaeger_image: "jaegertracing/jaeger:2.20.0"
kube_prometheus_stack_version: "88.0.0"

# Must list both clusters' Kubernetes minor (1.36) as e2e tested; bump this
# before moving either cluster to a newer minor.
cilium_version: "1.20.1"

# Held at 1.36 because Cilium 1.20 is not tested against 1.37. The package
# revision is pkgs.k8s.io's suffix, installed exactly (`1.36.5-1.1`).
kubernetes_version: "1.36.5"
kubernetes_package_revision: "1.1"

# The 2.3 LTS line supports Kubernetes 1.36 and 1.37, so the next minor bump
# needs no runtime change. Installed from the upstream tarball.
containerd_version: "2.3.6"

kube_vip_version: "v1.2.4"

# The version Cilium 1.20 is built against, not the newest patch. The CRDs go
# in before Cilium, which only programs Gateways whose CRDs exist at start.
gateway_api_version: "v1.6.1"
longhorn_version: "1.12.1"
cert_manager_version: "v1.21.2"
awx_operator_version: "3.2.1"
vault_chart_version: "0.34.1"
open_webui_chart_version: "18.0.0"

# Pinned hard: upstream has deleted the nested launcher runtime these
# topologies use (PR #307), so an upgrade would change the execution model.
clabernetes_version: "0.8.0"

# No helm pin: helm is a workstation prerequisite checked by roles/preflight,
# and nothing here installs it, so a pinned number could never be enforced.

# ---- cross-role contracts --------------------------------------------------
# Values one role owns and another reads. They must live here because
# _layers.yml includes roles dynamically, which scopes role defaults to the role.

# The cluster's nodes. roles/cilium and roles/longhorn act for every node;
# multi-node clusters override this in their group_vars.
cluster_hosts: ["{{ inventory_hostname }}"]

# LoadBalancer pools as host offsets within the cluster's /24, so no address
# is committed. Declared by roles/cilium, read by roles/gateway.
lb_pools: []
# A pool with a `label` serves only Services carrying it; one without serves
# only Services without it.
lb_pool_label: infra/lb-pool

# The cluster root CA on the workstation. Written by roles/cert_manager, read
# by roles/gateway to verify HTTPS end to end.
cluster_ca_dir: "{{ lookup('env', 'HOME') }}/.local/share/infra/pki/{{ kubeconfig_context }}"

k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# llama-server's API key on the workstation, because revenant's cluster does not
# survive a reload. Written by roles/llama_server, read by roles/open_webui.
llama_server_key_file: "{{ lookup('env', 'HOME') }}/.local/share/infra/revenant-llama-api-key"

# Used by roles/observability for remote_write and Grafana's datasource. Whether
# a cluster hosts the store is decided by metrics_stores membership, not these.
victoriametrics_name: victoriametrics
victoriametrics_namespace: observability
victoriametrics_port: 8428

observability_namespace: observability

# Read by roles/preflight, which runs before roles/registry, so it must be
# defined here rather than in the registry role's defaults.
registry_root: /srv/registry
