# Defaults shared by every host with an NVIDIA GPU, ported from gpu-bench's
# bringup.sh.
---
# ---- driver ----------------------------------------------------------------
# Open modules from Ubuntu's own archive; they are required for Blackwell.
# Ubuntu dropped the `nvidia-open` metapackage, so the branch is in the name.
nvidia_driver_package: nvidia-driver-610-open

# `latest` installs the newest build when no driver is present. An explicit
# Debian version is enforced and verified.
nvidia_driver_version: latest

# Unheld, so the driver takes fixes within its branch along with Ubuntu's kernels;
# a held driver can be left with no module for a new kernel. Hold it only with an
# explicit version, which apt would otherwise move.
nvidia_driver_held: false

# The oldest driver that runs Blackwell (sm_120) kernels; a property of the
# hardware, so it does not track nvidia_driver_version.
nvidia_driver_min_major: 570

# ---- container toolkit -----------------------------------------------------
# Installed before k3s (asserted in _layers.yml), so k3s registers the nvidia
# runtime on its first start. Always held: it has no kernel half to keep in step,
# and an unplanned upgrade changes how every GPU pod starts.
nvidia_toolkit_package: nvidia-container-toolkit
nvidia_toolkit_version: latest

# ---- device plugin ---------------------------------------------------------
# Chart version, without the leading v.
nvidia_device_plugin_chart_version: "0.19.3"
nvidia_device_plugin_namespace: nvidia-device-plugin
nvidia_device_plugin_release: nvdp

# none | timeslicing | mps. Off by default because sharing one GPU measurably
# lost throughput; see gpu-bench docs/findings/.
nvidia_gpu_sharing: none

# ---- DCGM exporter ---------------------------------------------------------
dcgm_chart_version: "4.8.2"
