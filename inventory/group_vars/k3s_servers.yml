# Defaults correct on every k3s server because it is a k3s host. A value that
# needs a per-machine reason belongs in host_vars, even if only one host uses it.

# Install-time arguments, declared and not reconciled (see ARCHITECTURE.md).
# max-pods is absent because the kubelet default suits the memory-bound Pis.
k3s_server_args:
  - "--secrets-encryption"
  - "--disable=traefik"

# The k3s default, since the Pis boot from one SSD with nothing to redirect to.
k3s_storage_path: /var/lib/rancher/k3s/storage
