# necropolis: the cluster's identity, shared by its three nodes. The nodes need
# no host_vars, since their addresses and interfaces are facts.

# ---- cluster identity ------------------------------------------------------
# Named for the cluster, not a node; one node is called spectre.
kubeconfig_context: necropolis

# ---- control plane ---------------------------------------------------------
# A DNS A record for the kube-vip VIP. roles/lan_dns publishes it at this host
# offset within the nodes' /24, so no address is committed; kubeadm still
# resolves the name at run time, so the record is the one place it is read.
kubeadm_control_plane_endpoint: necropolis.lan
kubeadm_control_plane_vip_offset: 85

# Read by both kubeadm and Cilium IPAM so they cannot disagree. Neither may
# overlap the LAN.
kubeadm_control_plane_pod_subnet: 10.244.0.0/16
kubeadm_control_plane_service_subnet: 10.96.0.0/12

cluster_hosts: "{{ groups['necropolis'] }}"

# ---- base ------------------------------------------------------------------
# Raised for cEOS as on revenant. Every node gets it because the scheduler may
# place a whole lab on one node.
base_sysctl:
  fs.inotify.max_user_instances: "32768"
  fs.inotify.max_user_watches: "1048576"

# ---- observability ---------------------------------------------------------
# Required and unique across the estate.
prometheus_external_labels:
  cluster: necropolis

# Jaeger, Grafana and the discovery contract exist once, on phantom.
observability_jaeger_enabled: false
observability_grafana_enabled: false
observability_write_discovery_contract: false

# Must be right at first install, because a StatefulSet's volume claim cannot
# be changed in place.
prometheus_storage_class: longhorn

# ---- nut -------------------------------------------------------------------
# Nothing here: the UPS server is set for the whole power domain in ups_main.yml.

# ---- cilium ----------------------------------------------------------------

# The VIP, not a node, so Cilium reaches the API without kube-proxy and
# without undoing the HA.
cilium_k8s_service_host: "{{ kubeadm_control_plane_vip }}"
cilium_pod_cidr: "{{ kubeadm_control_plane_pod_subnet }}"

# Two replicas survive losing one node.
cilium_operator_replicas: 2

# Nodes answer ARP for LoadBalancer addresses, so no load balancer appliance
# is needed.
cilium_l2_announcements: true
cilium_gateway_api: true

# Host offsets within the nodes' /24: .8x for nodes and the VIP, .9x for
# Cilium. The VIP is in no pool, since kube-vip already answers ARP for it.
lb_pools:
  - name: gateway
    first: 90
    last: 90
    label: gateway
  - name: general
    first: 91
    last: 99

# ---- gateway ---------------------------------------------------------------
# HTTPS front door for UIs; roles/lan_dns publishes each route's hostname at
# the Gateway's address. The Longhorn UI
# is excluded because it has no authentication and can delete volumes.
gateway_pool: gateway

# Named here so the awx, vault and open_webui roles reach the same hostnames
# they are routed on.
awx_hostname: awx.lan
vault_hostname: vault.lan
open_webui_hostname: seance.lan

gateway_routes:
  - name: hubble
    hostname: hubble.lan
    namespace: kube-system
    service: hubble-ui
    port: 80
  - name: awx
    hostname: "{{ awx_hostname }}"
    namespace: awx
    service: awx-service
    port: 80
  - name: vault
    hostname: "{{ vault_hostname }}"
    namespace: vault
    service: vault
    port: 8200
  - name: open-webui
    hostname: "{{ open_webui_hostname }}"
    namespace: open-webui
    service: seance-open-webui
    port: 80
