# Template for a new host: copy to <hostname>.yml and edit. Declare only values
# that differ per machine; facts, addresses and shared values do not belong here.

# ---- cluster identity ------------------------------------------------------
# Names the cluster, not the machine. Preflight refuses `default`.
kubeconfig_context: <cluster-name>

# ---- observability ---------------------------------------------------------
observability_namespace: observability

# Required and unique across the estate, or series from different clusters merge.
prometheus_external_labels:
  cluster: <cluster-name>

prometheus_retention: 24h

# The real disk bound, since local-path enforces no quota.
prometheus_retention_size: 15GB

# Defaults to metrics.lan; override only to stop the store host recording itself.
# prometheus_remote_write_url: "http://{{ metrics_alias }}:{{ victoriametrics_node_port }}/api/v1/write"

# ---- k3s -------------------------------------------------------------------
# Defaults come from group_vars/k3s_servers.yml. An override replaces the whole
# list, so restate every entry.
# k3s_server_args:
#   - "--secrets-encryption"
#   - "--disable=traefik"

# ---- registry --------------------------------------------------------------
# Only on the registry host; consumers use registry.lan.
# registry_root: /srv/registry
