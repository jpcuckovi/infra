# phantom: the durable box, serving the registry, observability and the
# long-term metrics store. Built first, because revenant's k3s needs the registry.

# ---- cluster identity ------------------------------------------------------
# Names what the cluster is for, so it survives rehoming. Never `default`.
kubeconfig_context: services

# ---- observability ---------------------------------------------------------
observability_namespace: observability

# Required and unique across the estate, or series from different clusters merge.
prometheus_external_labels:
  cluster: services

# A scrape buffer that survives a pod restart; history lives in VictoriaMetrics.
prometheus_retention: 24h

# The real disk bound, since local-path enforces no quota.
prometheus_retention_size: 15GB

# ---- long-term metrics -----------------------------------------------------
# Months. Sized for how far back a question might reach; well within the
# terabyte at under a gigabyte a day.
victoriametrics_retention_period: "24"
victoriametrics_storage_size: 1000Gi

# ---- registry --------------------------------------------------------------
registry_root: /srv/registry
