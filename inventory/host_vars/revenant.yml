# revenant: the lab box for GPU work, cEOS topologies, failure injection and
# ztlab's installation. The estate's durable services stay on phantom.

# ---- cluster identity ------------------------------------------------------
# Named for the machine, a deliberate exception: this single-node cluster
# exists only on this machine, so it can never be rehomed.
kubeconfig_context: revenant

# ---- observability ---------------------------------------------------------
# Required and unique across the estate, or series from different clusters merge.
prometheus_external_labels:
  cluster: revenant

# Each exists once, on phantom. Tracing must not compete with the GPU it
# traces, and a second contract writer would overwrite phantom's on every run.
observability_jaeger_enabled: false
observability_grafana_enabled: false
observability_write_discovery_contract: false

# ---- k3s -------------------------------------------------------------------
# max-pods 250 for several cEOS labs beside the stack. The last three hand the
# pod network to Cilium; install-time only, so they must be right first time.
k3s_server_args:
  - "--secrets-encryption"
  - "--disable=traefik"
  - "--kubelet-arg=max-pods=250"
  - "--flannel-backend=none"
  - "--disable-network-policy"
  - "--disable-kube-proxy"

# ---- cilium ----------------------------------------------------------------
# The node answers ARP for LoadBalancer addresses, so a Service can have its
# own LAN IP without a load balancer appliance. Host offsets within the node's
# /24, kept just above the node itself.
cilium_l2_announcements: true
lb_pools:
  - name: general
    first: 11
    last: 14

# ---- inotify ---------------------------------------------------------------
# A cEOS node needs about 1250 instances; too few and its agents fail with "Too
# many open files" while the lab looks merely slow to converge.
base_sysctl:
  fs.inotify.max_user_instances: "32768"
  fs.inotify.max_user_watches: "1048576"
