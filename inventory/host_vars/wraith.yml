# wraith: ztlab's headquarters, a Pi 4 running single-node k3s with SPIRE, OPA
# and the decision-plane services. See playbooks/wraith/main.yml for why.

# ---- link ------------------------------------------------------------------
# Wireless only (eth0 has no carrier); roles/wifi_link discovers the interface.

# ---- containerlab ----------------------------------------------------------
# Pins live in roles/containerlab/defaults since only that role reads them. The
# role is no longer composed here but stays for the next topology host.

# ---- cluster identity ------------------------------------------------------
# Named for the machine, because the cluster lives exactly as long as it does.
kubeconfig_context: wraith

# ---- observability ---------------------------------------------------------
# Required and unique across the estate, or series from different clusters merge.
prometheus_external_labels:
  cluster: wraith

# Jaeger, Grafana and the discovery contract exist once, on phantom.
observability_jaeger_enabled: false
observability_grafana_enabled: false
observability_write_discovery_contract: false

# ---- k3s -------------------------------------------------------------------
# Keeps bundled flannel: headquarters enforces no policy, so Cilium would be a
# dependency for nothing. Install-time only (see ARCHITECTURE.md).
k3s_server_args:
  - "--secrets-encryption"
  - "--disable=traefik"
