# The estate.
#
# Inventory hostnames ARE the ~/.ssh/config Host aliases, so `ansible_host` is
# deliberately absent everywhere in this file: ssh resolves the alias, and no
# address, username, port, or key path is ever committed. This is the whole
# mechanism by which the repository holds no real identifiers.
#
# Machine names are stable and arbitrary. Function lives in group membership and
# in DNS role aliases (registry.lan, metrics.lan), never in a hostname — a host
# is not a stable unit of purpose, and revenant proves it: the same box is either
# a standalone k3s server or a bare-metal kubeadm worker, and switching modes is
# an OS reload.

all:
  children:

    # ---- capability groups -------------------------------------------------
    # Membership decides which roles a host is eligible for and carries
    # group_vars. The per-host playbook still names the roles explicitly and in
    # order, because ordering is a property of the dependency graph rather than
    # of a host's wishes.

    k3s_servers:
      hosts:
        phantom:
        revenant:
        wraith:

    registry_hosts:
      hosts:
        phantom:

    metrics_stores:
      hosts:
        phantom:

    observability_hosts:
      hosts:
        phantom:
        revenant:
        wraith:

    # Clusters formed by kubeadm rather than k3s. Membership decides how the
    # control plane is SCRAPED, which is the one place the two distributions
    # differ for this repository: k3s bundles apiserver, scheduler, controller
    # manager and etcd into a single process exposing none of the standard
    # metrics ports, while kubeadm runs them as separate processes that this
    # estate's kubeadm-config deliberately binds so they can be scraped.
    #
    # A group rather than a fact because nothing the machine reports says which
    # distribution formed its cluster, and a host cannot be in both: they are
    # mutually exclusive installs, as roles/preflight already asserts.
    kubeadm_clusters:
      children:
        necropolis:

    # Hosts whose LAN link is wireless. Different chipsets and different
    # interface names between them, so roles/wifi_link discovers the interface
    # rather than naming one — wraith's onboard Broadcom answers to wlan0 and
    # revenant's USB adapter does not.
    #
    # This is a group rather than a fact because the consequence is a role a
    # host composes, and a wired machine should not carry wireless tooling to
    # satisfy tasks it skips.
    #
    # phantom left this group when its address moved from wlan0 to
    # eth0. The radio is still in the machine and still enumerates; membership
    # here is about the link a host SERVES on, and phantom no longer serves on
    # one.
    wifi_hosts:
      hosts:
        revenant:
        wraith:

    # Hosts whose LAN link is wired. The counterpart to wifi_hosts, separate for
    # the same reason: roles/wired_link carries what a CABLED machine needs, and
    # a wireless-only host should not install ethtool to satisfy tasks that would
    # find no interface to act on.
    #
    # Membership is the link a host actually SERVES on, not the ports it happens
    # to have. revenant carries two Ethernet controllers and is absent here
    # because neither one carries the LAN — there is no switch to plug them into,
    # and an unplugged port has no EEE to suppress.
    wired_hosts:
      hosts:
        phantom:
      children:
        necropolis:

    # Hosts that run containerlab network topologies. No Kubernetes: the labs are
    # containers wired together with veth pairs, driven by containerlab directly.
    #
    # A separate group rather than a fact about wraith, because the kernel
    # modules, the runtime and the pinned containerlab are what a TOPOLOGY HOST
    # needs — a second one would need the same set, and nothing about it is a
    # property of this particular Pi.
    containerlab_hosts:
      hosts:
        wraith:

    # Hosts that carry network topologies as KUBERNETES workloads, under the
    # clabernetes controller.
    #
    # Deliberately a separate group from containerlab_hosts rather than a wider
    # version of it. The kernel modules overlap; the runtime, the lifecycle and
    # the failure modes do not — one drives containerlab directly over veth
    # pairs with no Kubernetes at all, the other applies a custom resource and
    # lets a controller schedule pods. A host needing both would compose both
    # roles.
    #
    # revenant rather than wraith because cEOS images are amd64 and wraith is a
    # Pi. That constraint is already recorded in host_vars for both machines;
    # this group is where it becomes a fact about which roles run where.
    clabernetes_hosts:
      hosts:
        revenant:

    # Hosts with an NVIDIA GPU. Carries the driver, toolkit and chart pins,
    # which are properties of the hardware class rather than of any one machine.
    gpu_hosts:
      hosts:
        revenant:

    # ---- clusters ----------------------------------------------------------
    # A group per multi-node cluster, named for the CLUSTER and never for a
    # machine. It is what playbooks/<cluster>/ targets and what carries the
    # cluster's identity in group_vars/<cluster>.yml — the kubeconfig context and
    # the metrics label, which three nodes share and none of them owns.
    #
    # Nested into the capability groups above with `children:` rather than
    # listing each node there again, so a node joins or leaves the cluster in one
    # place.

    # necropolis — kubeadm HA on three identical Beelink SER8s, each with a
    # 512 GB boot drive and a 1 TB data drive for Longhorn, all wired. Built end
    # to end by this repository; docs/necropolis.md describes the build.
    #
    # ORDER IS MEANINGFUL. The first host listed is the one that runs
    # `kubeadm init` when no cluster exists yet; the others join. After that
    # the order means nothing, and roles/kubeadm_control_plane refuses to init
    # while the API answers, whatever the order.
    necropolis:
      hosts:
        cadaver:
        spectre:
        banshee:

    # ---- declared, not yet managed ----------------------------------------
    # The `future` group is deliberately absent rather than empty: every machine
    # in this file is now built by this repository. It returns, with the same
    # comment shape, the next time a host is declared before it can be reached —
    # promoting one is moving it into the capability groups above and adding
    # playbooks/<host>/, never a change to a role.
