# The estate. Hostnames are ~/.ssh/config aliases, so `ansible_host` is
# deliberately absent and no address, username or key path is committed.

all:
  children:

    # ---- capability groups -------------------------------------------------
    # Membership makes a host eligible for roles; the per-host playbook still
    # names roles explicitly, because ordering follows the dependency graph.

    k3s_servers:
      hosts:
        phantom:
        revenant:
        wraith:

    registry_hosts:
      hosts:
        phantom:

    metrics_stores:
      hosts:
        phantom:

    observability_hosts:
      hosts:
        phantom:
        revenant:
        wraith:
      children:
        necropolis:

    # Clusters formed by kubeadm, whose control-plane components are separate
    # scrapeable processes; k3s bundles them into one with no metrics ports.
    # A group rather than a fact, since no fact reveals which tool formed the cluster.
    kubeadm_clusters:
      children:
        necropolis:

    # Hosts whose serving link is wireless. roles/wifi_link discovers the
    # interface because chipsets and interface names differ between hosts.
    # Empty since every host is cabled; the group and role stay for the next
    # host whose only link is wireless.
    wifi_hosts:
      hosts: {}

    # Hosts whose serving link is wired. roles/wired_link discovers the
    # interfaces, so a host with several ports needs no naming here.
    wired_hosts:
      hosts:
        phantom:
        revenant:
        wraith:
      children:
        necropolis:

    # Hosts that drive containerlab topologies directly, with no Kubernetes.
    containerlab_hosts:
      hosts:
        wraith:

    # Hosts that run topologies as Kubernetes workloads under clabernetes.
    # On necropolis a topology spans nodes, so its links cross the pod network.
    clabernetes_hosts:
      hosts:
        revenant:
      children:
        necropolis:

    gpu_hosts:
      hosts:
        revenant:

    # Hosts powered from the one large UPS, a power domain rather than a
    # cluster. The unmanaged Umbrel box is also on it and gets the client
    # password by hand (see roles/nut/defaults).
    ups_main:
      hosts:
        phantom:
        revenant:
        wraith:
      children:
        necropolis:

    # ---- clusters ----------------------------------------------------------
    # A group per multi-node cluster, named for the cluster and nested into the
    # capability groups so a node joins or leaves in one place.

    # necropolis: kubeadm HA on three Beelink SER8s; see docs/necropolis.md.
    # The first host listed runs `kubeadm init` when no cluster exists yet.
    necropolis:
      hosts:
        cadaver:
        spectre:
        banshee:

    # ---- declared, not yet managed ----------------------------------------
    # The `future` group is absent because every host here is now managed. It
    # returns when a host is declared before it can be reached.
