# How the two layers run, imported by every playbooks/<host>/ playbook, which
# says only what to compose. Host layer: over SSH as root. Cluster layer: on the
# workstation, unprivileged, against the cluster API. Not an entry point.
#
# Parameters:
#   target         inventory host or cluster group (required)
#   host_roles     host-layer roles, in dependency order (required)
#   cluster_roles  cluster-layer roles, in dependency order (optional)
#   layer_mode     `main` to apply, `verify` to run each role's gates

- name: "{{ target }} — host layer"
  hosts: "{{ target }}"
  become: true
  gather_facts: true

  pre_tasks:
    # Each assert names the one forbidden arrangement rather than comparing
    # indices, because `.index()` raises for a host composing only one role.
    - name: Assert the host role order respects the dependency graph
      ansible.builtin.assert:
        that:
          - host_order_pair != ['k3s_server', 'registry_mirror']
        fail_msg: >-
          {{ target }} composes k3s_server before registry_mirror.

          k3s reads /etc/rancher/k3s/registries.yaml ONCE, at first start.
          Written afterwards, the mirror is correct on disk and inert in the
          running process, and correcting it takes a restart that bounces every
          pod on the node. The failure appears later, on a different machine, as
          an ImagePullBackOff naming an image rather than a config.

          Declared order: {{ host_roles }}
        success_msg: "host role order valid"
      vars:
        # registry_mirror owns the file k3s reads; naming `registry` would let
        # pull-only hosts pass unchecked.
        host_order_pair: >-
          {{ host_roles | select('in', ['registry_mirror', 'k3s_server']) | list }}

    - name: Assert the GPU runtime is composed before k3s
      ansible.builtin.assert:
        that:
          - gpu_order_pair != ['k3s_server', 'nvidia_runtime']
        fail_msg: >-
          {{ target }} composes k3s_server before nvidia_runtime.

          k3s scans PATH for nvidia-container-runtime ONCE, when it starts, and
          writes the nvidia runtime into the containerd config it generates. The
          toolkit installed afterwards is invisible to it: k3s regenerates that
          config from its own template on every start, so editing it by hand does
          not survive either.

          The node stays Ready and the device plugin may even advertise a GPU,
          while every pod requesting the nvidia runtime class fails at start.
          Correcting it needs a k3s restart, which bounces every pod on the node.

          Declared order: {{ host_roles }}
        success_msg: "GPU runtime order valid"
      vars:
        gpu_order_pair: >-
          {{ host_roles | select('in', ['nvidia_runtime', 'k3s_server']) | list }}
      when: "'nvidia_runtime' in host_roles"

    - name: Assert a k3s without its bundled CNI composes one
      ansible.builtin.assert:
        that:
          - "'cilium' in cluster_roles | default([])"
        fail_msg: >-
          {{ target }} installs k3s with --flannel-backend=none but composes no
          CNI in its cluster layer.

          The node would install, register, and then stay NotReady for good: no
          pod, CoreDNS included, can be given an address. Nothing fails loudly on
          the way — roles/k3s_server waits only for registration on such a host,
          and k3s is healthy by every measure except the one that matters.

          Add cilium to cluster_roles, or remove the flag from k3s_server_args.
        success_msg: "CNI composed for a k3s without flannel"
      when:
        - "'k3s_server' in host_roles"
        - "'--flannel-backend=none' in k3s_server_args | default([])"

  tasks:
    # A distinct loop_var, because `item` would collide with loops inside the
    # roles. The name is static since it templates before the loop binds.
    - name: Host layer
      ansible.builtin.include_role:
        name: "{{ layer_role }}"
        tasks_from: "{{ layer_mode | default('main') }}"
        # Lets later roles read earlier roles' defaults (kubeconfig reads
        # k3s_server's, observability reads victoriametrics'), as `roles:` would.
        # Exposure is forward only, so role order matters for variables too.
        public: true
      loop: "{{ host_roles }}"
      loop_control:
        loop_var: layer_role
        label: "{{ layer_role }}"

- name: "{{ target }} — cluster layer"
  # First host only: a cluster has one API, so a group target would otherwise
  # install every chart once per node.
  hosts: "{{ target }}[0]"
  # `connection: local` rather than `hosts: localhost`, so inventory_hostname
  # stays the target and its host_vars still apply.
  connection: local
  become: false
  # Gathering here would file the workstation's facts under the target's name.
  gather_facts: false

  vars:
    # The discovered interpreter is the target's path and fails locally with
    # rc 127, often misreported as "helm not found". Use the controller's own.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  pre_tasks:
    - name: Assert the cluster role order respects the dependency graph
      ansible.builtin.assert:
        that:
          - cluster_order_pair != ['observability', 'victoriametrics']
        fail_msg: >-
          {{ target }} composes observability before victoriametrics.

          Prometheus should have somewhere to remote-write to before it starts
          writing. Installed the other way round, every install drops its first
          minutes of samples and logs a connection error that reads like a
          misconfiguration rather than an ordering problem.

          Declared order: {{ cluster_roles | default([]) }}
        success_msg: "cluster role order valid"
      vars:
        cluster_order_pair: >-
          {{ cluster_roles | default([])
             | select('in', ['victoriametrics', 'observability']) | list }}
      when: cluster_roles | default([]) | length > 0

    - name: Assert the CNI is the first cluster role
      ansible.builtin.assert:
        that:
          - cluster_roles[0] == 'cilium'
        fail_msg: >-
          {{ target }} composes cilium after {{ cluster_roles[0] }}.

          Until the CNI is installed no pod can be given an address, so every
          chart installed ahead of it waits on pods that cannot start and times
          out — reported as that chart's failure rather than as a missing
          network.

          Declared order: {{ cluster_roles }}
        success_msg: "CNI is the first cluster role"
      when: "'cilium' in cluster_roles | default([])"

    # Runs in verify mode too, because the gates use the same libraries.
    - name: Controller preconditions
      ansible.builtin.include_role:
        name: preflight
        tasks_from: controller
      when: cluster_roles | default([]) | length > 0

  tasks:
    # loop_var and static name as in the host layer.
    - name: Cluster layer
      ansible.builtin.include_role:
        name: "{{ layer_role }}"
        tasks_from: "{{ layer_mode | default('main') }}"
        public: true
      loop: "{{ cluster_roles | default([]) }}"
      loop_control:
        loop_var: layer_role
        label: "{{ layer_role }}"
