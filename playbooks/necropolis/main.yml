# necropolis: kubeadm HA across cadaver, spectre and banshee. The host layer
# runs on all three nodes and the cluster layer once; docs/necropolis.md has
# the phases.

- import_playbook: ../_layers.yml
  vars:
    target: necropolis

    # wired_link early, since everything after it pulls packages across the
    # link. etcd_snapshot after kubeadm_control_plane, which creates the member
    # it snapshots. kubeconfig last, because admin.conf exists only once the
    # control plane forms. No registry_mirror: containerd's hosts.toml does that job.
    host_roles:
      - preflight
      - base
      - log_retention
      - wired_link
      - nut
      - containerd
      - kubeadm_node
      - longhorn_node
      - clabernetes_host
      - kubeadm_control_plane
      - etcd_snapshot
      - kubeconfig

    # cilium first (it also installs the Gateway API CRDs); longhorn before
    # anything that claims a volume; cert_manager before gateway, whose
    # certificate it issues; awx after longhorn and gateway, for its database
    # volume and its route; vault after gateway too, because it initializes and
    # unseals through its route. No victoriametrics: this cluster writes to phantom's.
    cluster_roles:
      - cilium
      - longhorn
      - cert_manager
      - gateway
      - observability
      - clabernetes
      - awx
      - vault
      - open_webui
