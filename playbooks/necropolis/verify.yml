# necropolis acceptance gate; each role owns its checks in tasks/verify.yml.
# main.yml minus preflight and kubeconfig, whose product kubeadm_control_plane's
# last gate checks.

- import_playbook: ../_layers.yml
  vars:
    target: necropolis
    layer_mode: verify

    host_roles:
      - base
      - log_retention
      - wired_link
      - nut
      - containerd
      - kubeadm_node
      - longhorn_node
      - clabernetes_host
      - kubeadm_control_plane
      - etcd_snapshot

    cluster_roles:
      - cilium
      - longhorn
      - cert_manager
      - gateway
      - observability
      - clabernetes
      - awx
      - vault
      - open_webui
