# phantom: the shared services host (image registry, long-term metrics store,
# observability). Built first because every other host consumes it.

- import_playbook: ../_layers.yml
  vars:
    target: phantom

    # preflight first, so nothing changes before preconditions hold; kubeconfig
    # last, because it reads a kubeconfig that k3s_server creates. Both registry
    # roles: phantom serves images and, like any k3s host, pulls them.
    host_roles:
      - preflight
      - base
      - wired_link
      - nut
      - registry_mirror
      - registry
      - k3s_server
      - kubeconfig

    cluster_roles:
      - victoriametrics
      - observability
      - uptime_kuma
