# phantom acceptance gate; each role owns its checks in tasks/verify.yml.
# main.yml minus preflight and kubeconfig, which the cluster gates exercise.

- import_playbook: ../_layers.yml
  vars:
    target: phantom
    layer_mode: verify

    host_roles:
      - base
      - log_retention
      - wired_link
      - nut
      - registry_mirror
      - registry
      - k3s_server

    cluster_roles:
      - victoriametrics
      - observability
