# revenant: change GPU sharing (-e nvidia_gpu_sharing=none|timeslicing|mps).
# Kept out of main.yml because sharing is node-wide and invisible to workloads.
# It does not persist: main.yml reverts it unless set in host_vars/revenant.yml.

- import_playbook: ../_layers.yml
  vars:
    target: revenant
    host_roles: []
    cluster_roles:
      - nvidia_device_plugin
