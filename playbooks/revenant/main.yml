# revenant: the lab box for GPU work, cEOS topologies and failure injection.
# The estate's durable services stay on phantom, so none is composed here.

- import_playbook: ../_layers.yml
  vars:
    target: revenant

    # wired_link early, because a host losing its link mid-run is worse than one
    # that never started. clabernetes_host before k3s_server: a lab on a kernel
    # without sch_netem impairs nothing and reports nothing.
    host_roles:
      - preflight
      - base
      - wired_link
      - nut
      - nvidia_runtime
      - clabernetes_host
      - registry_mirror
      - k3s_server
      - kubeconfig

    # No victoriametrics: this host remote-writes to phantom's via metrics.lan.
    # Topologies belong to ceos-diag-agent, never to this layer.
    cluster_roles:
      - cilium
      - observability
      - nvidia_device_plugin
      - clabernetes
