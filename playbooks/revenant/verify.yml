# revenant acceptance gate; each role owns its checks in tasks/verify.yml.
# main.yml minus preflight and kubeconfig, which the cluster gates exercise.

- import_playbook: ../_layers.yml
  vars:
    target: revenant
    layer_mode: verify

    host_roles:
      - base
      - wired_link
      - nut
      - nvidia_runtime
      - clabernetes_host
      - registry_mirror
      - k3s_server

    cluster_roles:
      - cilium
      - observability
      - nvidia_device_plugin
      - clabernetes
