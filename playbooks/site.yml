# The whole estate, in dependency order: a host that provides something is
# built before the hosts that consume it. Adding a machine is an import line
# here plus a playbooks/<host>/ directory, never a change to a role.

# phantom first: it serves the registry and metrics store every other host uses.
- import_playbook: phantom/main.yml

- import_playbook: revenant/main.yml

- import_playbook: wraith/main.yml

# necropolis last: its containerd names registry.lan, and an unreachable node
# then fails only the final play, after every other host has converged.
- import_playbook: necropolis/main.yml
