# wraith: ztlab's headquarters (SPIRE, OPA, the PDP) on a single-node k3s.
# Kept apart from revenant so a workload owner there cannot mint identities or
# change policy. containerlab is deliberately not composed: cEOS is amd64.

- import_playbook: ../_layers.yml
  vars:
    target: wraith

    # wired_link early, because a host losing its link mid-run is worse than one
    # that never had it.
    host_roles:
      - preflight
      - base
      - log_retention
      - wired_link
      - nut
      - registry_mirror
      - k3s_server
      - kubeconfig

    # No cilium: enforcement lives with the application on revenant, so k3s
    # keeps flannel and the Pi's kernel avoids an eBPF dataplane.
    # awx_runner: AWX on necropolis runs job pods here, so a job that drains a
    # necropolis node does not evict itself.
    cluster_roles:
      - observability
      - awx_runner
