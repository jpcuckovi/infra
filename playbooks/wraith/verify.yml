# wraith acceptance gate; each role owns its checks in tasks/verify.yml.
# main.yml minus preflight and kubeconfig.

- import_playbook: ../_layers.yml
  vars:
    target: wraith
    layer_mode: verify

    host_roles:
      - base
      - wifi_link
      - nut
      - registry_mirror
      - k3s_server

    cluster_roles:
      - observability
