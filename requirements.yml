# Collections this repository relies on. The first three ship bundled in the
# ansible package in ~/.venv; this file states the dependency for a rebuild elsewhere.
# A Galaxy install lands in ~/.ansible/collections, which shadows the bundled
# copy rather than upgrading it, so `collection list` will show both.

collections:
  # Imports the `kubernetes` library from Ansible's own interpreter, so both
  # must live in the same venv.
  - name: kubernetes.core
    version: ">=6.5.0"

  - name: ansible.posix
    version: ">=2.2.2"

  - name: community.general
    version: ">=13.3.0"

  # UniFi DNS policies, for roles/lan_dns. Not bundled and not on Galaxy, so
  # it installs from git into ~/.ansible/collections.
  - name: https://github.com/nightlabs-io/ansible-collection-unifi.git
    type: git
    version: v0.1.0
