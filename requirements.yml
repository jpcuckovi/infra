# Collections this repository relies on. All three ship bundled in the ansible
# package in ~/.venv; this file states the dependency for a rebuild elsewhere.
# A Galaxy install lands in ~/.ansible/collections, which shadows the bundled
# copy rather than upgrading it, so `collection list` will show both.

collections:
  # Imports the `kubernetes` library from Ansible's own interpreter, so both
  # must live in the same venv.
  - name: kubernetes.core
    version: ">=6.5.0"

  - name: ansible.posix
    version: ">=2.2.2"

  - name: community.general
    version: ">=13.3.0"
