# Installs the AWX Operator, which builds AWX from an AWX custom resource.
---
- name: Install the AWX Operator
  kubernetes.core.helm:
    context: "{{ kubeconfig_context }}"
    name: "{{ awx_operator_release }}"
    chart_ref: awx-operator
    chart_repo_url: "{{ awx_operator_chart_repo_url }}"
    chart_version: "{{ awx_operator_version }}"
    release_namespace: "{{ awx_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "5m"

- name: Apply AWX
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    definition: "{{ lookup('template', 'awx.yaml.j2') | from_yaml_all | list }}"
    apply: true

- name: Wait for the AWX to be programmed on its address
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    api_version: awx.ansible.com/v1beta1
    kind: AWX
    namespace: "{{ awx_namespace }}"
    name: "{{ awx_name }}"
  register: awx_info
  until: >-
    awx_info.resources | length == 1
    and (awx_info.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Successful')
         | map(attribute='status') | list) == ['True']
  retries: "{{ awx_wait_retries }}"
  delay: "{{ awx_wait_delay }}"
  when: not ansible_check_mode
