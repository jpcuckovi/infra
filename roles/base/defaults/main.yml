# Packages and kernel tunables every machine gets; workload tools go in their
# own roles. Operator tools (jq, dig) are kept although no task uses them.
---
base_packages:
  - bind9-dnsutils     # dig; every service here is found through a .lan name
  - ca-certificates
  - chrony             # clock skew breaks TLS and makes correlated logs lie
  - curl
  - git
  - gnupg
  - jq
  - make
  - net-tools
  - nvme-cli           # drive health and wear; harmless on the Pis, which have no NVMe
  - podman             # the registry runs under this, not under Docker
  - python3
  - traceroute
  - unzip

# A drop-in, because appending to /etc/sysctl.conf duplicates lines on every run.
base_sysctl_file: /etc/sysctl.d/60-infra.conf

# A control plane plus observability exhausts the inotify defaults, and the
# symptom ("too many open files", wedged controllers) never points at sysctl.
base_sysctl:
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "524288"

# The account AWX jobs log in as. Key only, no password and no sudo; a job that
# needs root earns a sudoers rule of its own. The public key is read from the
# workstation at run time, so no key is committed; the private half lives in
# Vault, where AWX's Machine credential reads it.
base_automation_user: awx
base_automation_pubkey_file: "{{ lookup('env', 'HOME') }}/.ssh/awx_ed25519.pub"
