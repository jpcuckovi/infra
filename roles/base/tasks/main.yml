# Baseline every machine gets: packages, clock, kernel tunables.
---
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  # A metadata refresh changes nothing declared; reporting it would make the
  # changed=0 gate depend on time since the last run.
  changed_when: false

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# rsyslog has no consumer here, and its AppArmor denial storm once filled the
# audit backlog and locked revenant out. Stopping it is not enough: the resident
# profile must be unloaded, before the purge removes the file apparmor_parser needs.
- name: Find any rsyslog AppArmor profile
  ansible.builtin.find:
    paths: /etc/apparmor.d
    patterns: "*rsyslog*"
    file_type: file
  register: base_rsyslog_profiles

- name: Unload the rsyslog AppArmor profile
  ansible.builtin.command: "apparmor_parser -R {{ item.path }}"
  loop: "{{ base_rsyslog_profiles.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: true
  # Unloading an already-unloaded profile errors harmlessly; this runs once per
  # host, since the purge removes the file.
  failed_when: false

- name: Remove rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: absent
    purge: true

- name: Apply kernel tunables
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ base_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ base_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Ensure the clock is disciplined
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

# A locked password leaves the key as the only way in.
- name: Create the automation account
  ansible.builtin.user:
    name: "{{ base_automation_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true

# exclusive drops any key added by hand, so the file holds only what is declared.
- name: Authorize the automation key
  ansible.posix.authorized_key:
    user: "{{ base_automation_user }}"
    key: "{{ lookup('ansible.builtin.file', base_automation_pubkey_file) }}"
    exclusive: true
