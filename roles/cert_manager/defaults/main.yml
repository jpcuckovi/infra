# cert-manager, issuing from a root CA that lives on the workstation.
#
# The CA is OUTSIDE the cluster, and that is the design. A cluster that exists
# to be rebuilt would mint a new root on every rebuild if its CA lived inside
# it, and every browser would have to re-trust it every time. Held on the
# workstation, the root survives any rebuild and is trusted once.
#
# Ported from k8s-aio's lib/pki.sh and cluster-issuer.yaml, whose CA lived on
# the SER9 — which is why it did not survive that machine leaving.
#
# WHAT THIS IS NOT: production key management. A real root stays offline, in
# an HSM or a managed CA, and signs an intermediate. Here it is a 0600 file on
# one Mac, and its key is copied into a cluster Secret because cert-manager has
# to sign with it. A lab trade-off, made knowingly.
---
cert_manager_chart_repo_url: https://charts.jetstack.io
cert_manager_release: cert-manager
cert_manager_namespace: cert-manager

# Pinned in group_vars/all.yml; restated so the role reads on its own.
cert_manager_version: "v1.21.2"

# On the workstation, in cluster_ca_dir (a cross-role contract in
# group_vars/all.yml). Never regenerated by this role once it exists: a new
# root silently invalidates every browser that trusts the old one, and the
# failure looks like a certificate that is correct.
cert_manager_ca_key: "{{ cluster_ca_dir }}/ca.key"
cert_manager_ca_crt: "{{ cluster_ca_dir }}/ca.crt"
cert_manager_ca_common_name: "{{ kubeconfig_context }} root CA"
# Ten years for the ROOT only. Leaves are 90 days and renew themselves;
# see roles/gateway.
cert_manager_ca_lifetime: "+3650d"

# The Secret must live in cert-manager's own namespace: a ClusterIssuer reads
# its Secret from the controller's namespace, not from the namespace of the
# Certificate being issued. The most common way a CA ClusterIssuer ends up
# permanently not Ready.
cert_manager_ca_secret: "{{ kubeconfig_context }}-root-ca"
cert_manager_issuer: "{{ kubeconfig_context }}-ca"
