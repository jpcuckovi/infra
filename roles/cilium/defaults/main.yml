# Cilium as the cluster CNI, with kube-proxy replacement and Hubble.
# Composed first in the cluster layer, since no pod starts before a CNI exists.
---
cilium_chart_repo_url: https://helm.cilium.io/
cilium_release: cilium
cilium_namespace: kube-system

# Without kube-proxy the `kubernetes` Service is unprogrammed, so Cilium needs a
# direct API address. Loopback is correct on a single-node k3s only.
cilium_k8s_service_host: 127.0.0.1
cilium_k8s_service_port: 6443

# k3s's default --cluster-cidr. The two must agree, so a host overriding one in
# host_vars overrides the other in the same file.
cilium_pod_cidr: 10.42.0.0/16

# Present on a node only when k3s was installed with its bundled flannel.
cilium_flannel_annotation: flannel.alpha.coreos.com/backend-type

# cluster_hosts is a cross-role contract in group_vars/all.yml (also read by
# roles/longhorn).

# Follows cluster size, so it lives here rather than in charts/values/. The
# chart default of two, with anti-affinity, never schedules on one node.
cilium_operator_replicas: 1

# ---- optional capabilities, off unless a cluster turns them on -------------
# Facts about a cluster's shape, so variables rather than shared chart values.

# Nodes answer ARP for LoadBalancer addresses, from the pools below.
cilium_l2_announcements: false

# L2 announcement Leases renew constantly; the upstream limits (qps 5, burst 10)
# throttle them into stalls that look like flapping announcements.
cilium_k8s_client_qps: 50
cilium_k8s_client_burst: 100

# lb_pools and lb_pool_label are cross-role contracts in group_vars/all.yml,
# also read by roles/gateway.

# Gateway API with GatewayClass `cilium`; requires kube-proxy replacement.
cilium_gateway_api: false
cilium_gateway_api_crds_url: >-
  https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml

# A ceiling, not a fixed wait: the task returns once every node is Ready.
cilium_node_ready_retries: 30
cilium_node_ready_delay: 10
