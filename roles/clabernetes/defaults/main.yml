# The clabernetes controller, a cluster capability installed from the
# workstation over the Kubernetes API. Nothing here belongs to the host.
---

# Not ghcr.io/srl-labs/clabernetes, whose tags stop at 0.6.0. The project moved
# and renamed its API group in 0.7.0; older docs still show the old reference.
clabernetes_chart_ref: "oci://ghcr.io/clabernetes/clabernetes/clabernetes"

clabernetes_release: clabernetes
clabernetes_namespace: c9s

# Finding the superseded group installed means a pre-0.7 release must be removed,
# not upgraded.
clabernetes_crd: topologies.c9s.run
clabernetes_superseded_crd: topologies.clabernetes.containerlab.dev

# clabernetes 0.7 and later require Kubernetes 1.31 or newer.
clabernetes_min_kube_minor: 31

# ---- where the node's containerd lives -------------------------------------
# Chosen by group membership, never hostname: the answer belongs to the
# distribution that formed the cluster.

# k3s does not use containerd's conventional socket path; kubeadm clusters
# (roles/containerd) do.
clabernetes_cri_sock: >-
  {{ '/run/containerd/containerd.sock' if 'kubeadm_clusters' in group_names
     else '/run/k3s/containerd/containerd.sock' }}

# The containerd hosts directory that names registry.lan. If wrong, the launcher's
# pull fails for an image that does exist in the registry.
clabernetes_cri_hosts_dir: >-
  {{ '/etc/containerd/certs.d' if 'kubeadm_clusters' in group_names
     else '/var/lib/rancher/k3s/agent/etc/containerd/certs.d' }}

# One manager on every cluster. The controller acts only when a topology changes,
# so standby replicas cost memory and buy nothing a lab would notice.
clabernetes_manager_replicas: 1
