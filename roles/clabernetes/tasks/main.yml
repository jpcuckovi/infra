# Installs the clabernetes controller, in the same shape as the
# kube-prometheus-stack install in roles/observability.
---
- name: Assert a superseded clabernetes is not installed
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    kind: CustomResourceDefinition
    name: "{{ clabernetes_superseded_crd }}"
  register: clabernetes_old_crd
  check_mode: false

# Checked before install: both CRDs can coexist while the controller reconciles
# only one, so topologies would apply and never be acted on.
- name: Refuse to install alongside the pre-0.7 API group
  ansible.builtin.assert:
    that:
      - clabernetes_old_crd.resources | length == 0
    fail_msg: >-
      {{ clabernetes_superseded_crd }} exists on this cluster, so a clabernetes
      release older than 0.7 is installed.

      The API group was renamed in v0.7.0 and there is NO upgrade path across it.
      Remove the old release and its CRDs first; upgrading in place leaves a
      controller reconciling an API nothing writes to any more.
    success_msg: "no superseded clabernetes CRD present"

# wait: false, uniquely in the estate. The chart deletes its bootstrap ConfigMap
# once consumed, so helm --wait times out and marks the release failed. The
# controller and the Config singleton are checked below instead.
- name: Install clabernetes
  kubernetes.core.helm:
    context: "{{ kubeconfig_context }}"
    name: "{{ clabernetes_release }}"
    chart_ref: "{{ clabernetes_chart_ref }}"
    chart_version: "{{ clabernetes_version }}"
    release_namespace: "{{ clabernetes_namespace }}"
    create_namespace: true
# The values file is shared by every cluster; these per-cluster facts override it.
    values_files:
      - "{{ role_path }}/../../charts/values/clabernetes.yaml"
    values:
      manager:
        replicaCount: "{{ clabernetes_manager_replicas | int }}"
      globalConfig:
        imagePull:
          criSockOverride: "{{ clabernetes_cri_sock }}"
          criHostsDir: "{{ clabernetes_cri_hosts_dir }}"
    wait: false

- name: Wait for the controller to become available
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    kind: Deployment
    namespace: "{{ clabernetes_namespace }}"
    name: "{{ clabernetes_release }}-manager"
  register: clabernetes_manager
  # default([]): a lookup that itself fails returns no `resources` key, and an
  # undefined attribute in `until` aborts the task instead of retrying it.
  until: >-
    clabernetes_manager.resources | default([]) | length > 0
    and (clabernetes_manager.resources[0].status.availableReplicas | default(0)) > 0
  retries: 30
  delay: 10

# The ConfigMap is gone by design once consumed; the singleton is where the
# settings must have landed.
- name: Wait for the bootstrap config to reach the singleton
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    api_version: c9s.run/v1alpha1
    kind: Config
    namespace: "{{ clabernetes_namespace }}"
    name: "{{ clabernetes_release }}"
  register: clabernetes_singleton
  until: clabernetes_singleton.resources | default([]) | length > 0
  retries: 30
  delay: 10
