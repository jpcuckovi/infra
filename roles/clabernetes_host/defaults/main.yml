# A node that carries network topologies as Kubernetes workloads. It installs no
# podman, containerlab, controller or topology: the launcher image brings
# containerlab, and k3s provides the runtime.
---

# ---- kernel modules ---------------------------------------------------------
# sch_netem is the trap: without it tc accepts a netem qdisc and impairs nothing,
# so a fault scenario silently scores as an agent miss. bonding carries the cEOS
# lab's LACP bundle into the MLAG pair. mpls_router is omitted because nothing
# uses MPLS and the generic amd64 kernel would need linux-modules-extra for it.
clabernetes_kernel_modules:
  - sch_netem
  - veth
  - vrf
  - bonding
  - 8021q

# Named for this role so a host carrying both roles keeps both lists.
clabernetes_modules_conf: /etc/modules-load.d/clabernetes.conf

# Empty unless `modinfo -n <module>` reports "not found" on this kernel. It matches
# roles/containerlab only by coincidence; that host runs a different kernel.
clabernetes_modules_extra_package: ""

# ---- inotify ----------------------------------------------------------------
# containerlab's scale note gives 1250 inotify instances per cEOS node. This feeds
# the gate only; the sysctl itself is set by roles/base and host_vars.
clabernetes_inotify_per_node: 1250

# Seven cEOS nodes is the current lab; the headroom lets a second lab coexist.
clabernetes_expected_nodes: 14
