# containerd for kubeadm nodes, from the upstream release tarball.
# Ubuntu 26.04's package SIGSEGVs on any invocation, so it cannot be used.
---
# Pinned in group_vars/all.yml, which wins; restated so the role reads alone.
containerd_version: "2.3.6"

# From facts, in Go's naming, rather than declared.
containerd_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

# Published names must be kept: get_url matches the .sha256sum line by file name.
containerd_tarball: "containerd-{{ containerd_version }}-linux-{{ containerd_arch }}.tar.gz"
containerd_release_url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}"

# Not /tmp, so a reboot forces no re-download and the verified tarball stays.
containerd_cache_dir: /var/cache/infra/containerd

# The tarball installs to /usr/local/bin, where Ubuntu's unit does not look,
# hence the role's own unit.
containerd_bin: /usr/local/bin/containerd
containerd_unit_path: /etc/systemd/system/containerd.service
containerd_config_dir: /etc/containerd

# containerd 2.x defaults this to '', so unset every hosts.toml is silently ignored.
containerd_registry_config_path: /etc/containerd/certs.d

# The tarball carries containerd and its shims only; runc comes from apt.
containerd_packages:
  - runc
