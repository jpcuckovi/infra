# containerd from the verified upstream tarball, configured for kubelet.
# kubeadm nodes only: k3s bundles its own, and two runtimes would share images.
---
- name: Install runc
  ansible.builtin.apt:
    name: "{{ containerd_packages }}"
    state: present

# The binary's own version, not a `creates:` guard, which a wrong version
# satisfies forever (as once happened with k3s_version).
- name: Read the installed containerd version
  ansible.builtin.command: "{{ containerd_bin }} --version"
  register: containerd_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Settle whether the pinned release is installed
  ansible.builtin.set_fact:
    # Matched with surrounding spaces so 2.3.6 does not accept 2.3.60.
    containerd_current: >-
      {{ containerd_installed.rc == 0
         and (' v' ~ containerd_version ~ ' ') in (containerd_installed.stdout ~ ' ') }}

- name: Ensure the artifact cache exists
  ansible.builtin.file:
    path: "{{ containerd_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: containerd_cache

# get_url verifies against the published .sha256sum, so verification cannot
# silently lapse as a hand-quoted `sha256sum -c` can.
- name: Download the pinned containerd release
  ansible.builtin.get_url:
    url: "{{ containerd_release_url }}/{{ containerd_tarball }}"
    dest: "{{ containerd_cache_dir }}/{{ containerd_tarball }}"
    checksum: "sha256:{{ containerd_release_url }}/{{ containerd_tarball }}.sha256sum"
    owner: root
    group: root
    mode: "0644"
  # Under --check the cache dir may only be simulated, and get_url fails on a
  # missing destination directory even in check mode.
  when: not (ansible_check_mode and containerd_cache is changed)

# Only when off the pin, else every run reports changed. Skipped under --check,
# which has no tarball to open.
- name: Install containerd into /usr/local
  ansible.builtin.unarchive:
    src: "{{ containerd_cache_dir }}/{{ containerd_tarball }}"
    dest: /usr/local
    remote_src: true
    owner: root
    group: root
  when:
    - not containerd_current
    - not ansible_check_mode
  notify: Restart containerd

- name: Install the containerd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: "{{ containerd_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Ensure the configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ containerd_config_dir }}"
    - "{{ containerd_registry_config_path }}/{{ registry_alias }}:{{ registry_port }}"

- name: Configure containerd for kubelet
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config_dir }}/config.toml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

# Read on every pull, so unlike k3s's registries.yaml it needs no restart or
# ordering constraint.
- name: Declare the estate registry
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ containerd_registry_config_path }}/{{ registry_alias }}:{{ registry_port }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"

# Here rather than in kubeadm_node, which installs crictl, because the socket is
# this role's. Without it crictl tries several sockets in turn, warning on each.
- name: Point crictl at containerd
  ansible.builtin.copy:
    dest: "{{ containerd_crictl_config }}"
    content: |
      runtime-endpoint: unix://{{ containerd_socket }}
      image-endpoint: unix://{{ containerd_socket }}
    owner: root
    group: root
    mode: "0644"

# Now, not at play end: kubeadm_node follows, and verify reads the running config.
- name: Apply containerd changes
  ansible.builtin.meta: flush_handlers

- name: Start containerd
  ansible.builtin.systemd_service:
    name: containerd.service
    state: started
    enabled: true
    daemon_reload: true
  # Under --check the unit was only simulated, so there is nothing to start.
  when: not ansible_check_mode
