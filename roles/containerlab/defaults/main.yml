# A containerlab host: runtime, pinned containerlab and kernel modules. Running
# topologies is left to the repository that owns the experiment.
---

# ---- container runtime -------------------------------------------------------
# Rootless podman, not docker.io: the estate already runs podman, and the
# `docker` group is root-equivalent.
containerlab_packages:
  - podman
  - ca-certificates

# ---- containerlab ------------------------------------------------------------
# Pinned and installed from the release .deb rather than the curl-pipe-bash
# installer, so the version is reproducible and dpkg can report and remove it.
containerlab_version: "0.79.0"
containerlab_deb_url: >-
  https://github.com/srl-labs/containerlab/releases/download/v{{ containerlab_version }}/containerlab_{{ containerlab_version }}_linux_{{ containerlab_deb_arch }}.deb

# ---- kernel modules ----------------------------------------------------------
# Here rather than in base: only topology hosts need them. sch_netem carries the
# L1/L2 fault catalogue and veth is containerlab's link primitive.
containerlab_kernel_modules:
  - sch_netem
  - mpls_router
  - vrf
  - veth

# Empty because Ubuntu 26.04's raspi kernel ships all four modules and
# linux-modules-extra-raspi no longer exists. Set it only if `modinfo -n` fails.
containerlab_modules_extra_package: ""

# Named for the role, not a host, so it reads correctly on any containerlab host.
containerlab_modules_conf: /etc/modules-load.d/containerlab.conf
