# Converge a host to the state a containerlab topology needs. The only ordering
# constraint: any extra-modules package must be installed before modprobe.
---
- name: Install the container runtime
  ansible.builtin.apt:
    name: "{{ containerlab_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  # Retries because unattended-upgrades holds the dpkg lock on a freshly
  # installed machine, which is exactly when this role first runs.
  register: containerlab_apt
  retries: 3
  delay: 30
  until: containerlab_apt is succeeded

- name: Install the extra kernel modules package
  ansible.builtin.apt:
    name: "{{ containerlab_modules_extra_package }}"
    state: present
  when: containerlab_modules_extra_package | length > 0
  register: containerlab_modules_pkg
  retries: 3
  delay: 30
  until: containerlab_modules_pkg is succeeded

# Without a fresh index a just-installed module is on disk but unloadable.
- name: Refresh the module dependency index
  ansible.builtin.command: depmod -a
  changed_when: false
  when: containerlab_modules_pkg is defined and containerlab_modules_pkg.changed

- name: Load the topology kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ containerlab_kernel_modules }}"
  loop_control:
    label: "{{ item }}"
  register: containerlab_modprobe
  failed_when: false

# Fails only on modules that did not load, rather than always demanding a
# reboot; one is needed only when modules were installed for another kernel.
- name: Assert every topology module loaded
  ansible.builtin.assert:
    that:
      - containerlab_modprobe_failed | length == 0
    fail_msg: >-
      These kernel modules did not load: {{ containerlab_modprobe_failed | join(', ') }}.

      Running kernel is {{ ansible_facts['kernel'] }}.

      Ask the host whether the module exists at all:  modinfo -n <module>

      A path means it is present and failed to load for another reason. "not
      found" means this kernel does not carry it, and containerlab_modules_extra_package
      needs to name whatever supplies it on this release — it is empty by
      default because Ubuntu 26.04's raspi kernel ships all four in the base
      module set.

      If a package DID install modules for a different kernel version, they are
      on disk and unloadable until that kernel runs. Compare `uname -r` against
      `ls /lib/modules/` and reboot.

      Without sch_netem there is no impairment and the L1/L2 fault catalogue
      silently does nothing; without veth no topology comes up at all.
    success_msg: "modules loaded: {{ containerlab_kernel_modules | join(', ') }}"
  vars:
    containerlab_modprobe_failed: >-
      {{ containerlab_modprobe.results | default([])
         | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='item') | list }}

# Without this, netem silently impairs nothing after a reboot. A template, since
# ansible_managed is undefined in `copy: content:`.
- name: Persist the modules across reboot
  ansible.builtin.template:
    src: modules-load.conf.j2
    dest: "{{ containerlab_modules_conf }}"
    owner: root
    group: root
    mode: "0644"

- name: Read the package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: containerlab_arch
  changed_when: false
  check_mode: false

- name: Settle the architecture
  ansible.builtin.set_fact:
    containerlab_deb_arch: "{{ containerlab_arch.stdout | trim }}"

- name: Check the installed containerlab version
  ansible.builtin.command: dpkg-query -W -f='${Version}' containerlab
  register: containerlab_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Guarded on the version, not on the binary existing, so the pin is applied.
- name: Install containerlab
  ansible.builtin.apt:
    deb: "{{ containerlab_deb_url }}"
    state: present
  when: containerlab_installed.stdout | trim != containerlab_version
