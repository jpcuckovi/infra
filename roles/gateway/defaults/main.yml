# Defaults for one HTTPS front door per cluster: a Cilium-programmed Gateway on a
# fixed address, with a cluster-CA certificate and one HTTPRoute per UI.
---
gateway_name: "{{ kubeconfig_context }}"
gateway_namespace: gateway

# The lb_pools entry supplying the address; its label also confines that pool
# to this Gateway's Service.
gateway_pool: gateway

# Each entry: name, hostname (needs a DNS record), namespace, service, port.
gateway_routes: []

# Short-lived leaves that cert-manager rotates; only the root is long-lived.
gateway_issuer: "{{ kubeconfig_context }}-ca"
gateway_cert_duration: 2160h
gateway_cert_renew_before: 720h
gateway_tls_secret: "{{ gateway_name }}-gateway-tls"

# The workstation CA that roles/cert_manager writes, used by the end-to-end gate.
gateway_ca_crt: "{{ cluster_ca_dir }}/ca.crt"

gateway_programmed_retries: 30
gateway_programmed_delay: 10
