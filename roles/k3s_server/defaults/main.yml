# Single-node k3s. Only the server arguments and architecture vary between
# hosts; kubeadm clusters use their own role.
---
k3s_install_url: https://get.k3s.io
k3s_binary_path: /usr/local/bin/k3s
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Overridden in group_vars/k3s_servers.yml; repeated here so the role is
# self-contained and readable on its own.
k3s_server_args:
  - "--secrets-encryption"
  - "--disable=traefik"

# A ceiling, not a wait: the task returns on Ready, so this only bounds how long
# a stuck install can pass for a slow one. Deliberately not tied to one board.
k3s_ready_timeout: 180

# Derived from the install arguments so the two cannot disagree. Without flannel
# the node stays NotReady until a CNI exists, so the install waits for registration.
k3s_bundled_cni: "{{ '--flannel-backend=none' not in k3s_server_args }}"
