# Installs k3s and waits for the node. Runs after registry_mirror so k3s reads
# the mirror config at first start.
---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_binary

- name: Install k3s
  ansible.builtin.shell:
    cmd: >-
      curl -sfL {{ k3s_install_url }} |
      INSTALL_K3S_VERSION='{{ k3s_version }}'
      INSTALL_K3S_EXEC='server {{ k3s_server_args | join(" ") }}'
      sh -
    creates: "{{ k3s_binary_path }}"
  when: not k3s_binary.stat.exists
# The one shell-out: k3s ships only an installer script. `creates:` makes it
# idempotent, and `when:` keeps the intent visible under --check.

- name: Ensure k3s is running and enabled
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
# Skipped under --check: on a fresh host the install could not run, so there is
# no k3s.service and the dry run would stop here.
  when: not ansible_check_mode

- name: Wait for the node to report Ready
  ansible.builtin.command: >-
    {{ k3s_binary_path }} kubectl wait --for=condition=Ready node --all
    --timeout={{ k3s_ready_timeout }}s
  register: k3s_node_ready
  changed_when: false
  when:
    - not ansible_check_mode
    - k3s_bundled_cni | bool

# Without a bundled CNI, Ready depends on the cluster layer; registration is the
# most this layer can prove, and roles/cilium owns the Ready wait.
- name: Wait for the node to register
  ansible.builtin.command: "{{ k3s_binary_path }} kubectl get node {{ inventory_hostname }}"
  register: k3s_node_registered
  until: k3s_node_registered.rc == 0
  retries: "{{ (k3s_ready_timeout | int) // 10 }}"
  delay: 10
  changed_when: false
  when:
    - not ansible_check_mode
    - not (k3s_bundled_cni | bool)

# --- kubeconfig for the login user -----------------------------------------
# For kubectl over SSH without sudo. The play runs as root, so the login user is
# read with become: false and its home is looked up rather than assumed.
- name: Determine the login user
  ansible.builtin.command: id -un
  become: false
  register: k3s_login_user
  changed_when: false
  check_mode: false

- name: Look up the login user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ k3s_login_user.stdout | trim }}"

- name: Create the login user's kube directory
  ansible.builtin.file:
    path: "{{ k3s_login_home }}/.kube"
    state: directory
    owner: "{{ k3s_login_user.stdout | trim }}"
    group: "{{ k3s_login_user.stdout | trim }}"
    mode: "0700"
  vars:
    k3s_login_home: "{{ ansible_facts.getent_passwd[k3s_login_user.stdout | trim][4] }}"

- name: Install the kubeconfig for the login user
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig_path }}"
    dest: "{{ k3s_login_home }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_login_user.stdout | trim }}"
    group: "{{ k3s_login_user.stdout | trim }}"
    mode: "0600"
  vars:
    k3s_login_home: "{{ ansible_facts.getent_passwd[k3s_login_user.stdout | trim][4] }}"
  when: not ansible_check_mode
