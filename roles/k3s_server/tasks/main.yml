# Install k3s and wait for the node to be usable.
#
# Runs AFTER the registry role, so /etc/rancher/k3s/registries.yaml already
# exists and k3s reads the mirror at first start rather than needing a restart
# that would bounce every pod.
---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_binary

- name: Install k3s
  ansible.builtin.shell:
    cmd: >-
      curl -sfL {{ k3s_install_url }} |
      INSTALL_K3S_VERSION='{{ k3s_version }}'
      INSTALL_K3S_EXEC='server {{ k3s_server_args | join(" ") }}'
      sh -
    creates: "{{ k3s_binary_path }}"
  when: not k3s_binary.stat.exists
  # The one unavoidable shell-out in this role: k3s ships an installer script
  # and there is no module for it. `creates:` gives it idempotency, and the
  # `when:` above makes the intent legible in --check output even though the
  # task itself cannot run there.

- name: Ensure k3s is running and enabled
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
  # Skipped under --check for the same reason as the registry's start task: on a
  # host where k3s is not yet installed, the install above could not run, so
  # there is no k3s.service to act on and the dry run dies here rather than
  # reporting the rest of the plan.
  when: not ansible_check_mode

- name: Wait for the node to report Ready
  ansible.builtin.command: >-
    {{ k3s_binary_path }} kubectl wait --for=condition=Ready node --all
    --timeout={{ k3s_ready_timeout }}s
  register: k3s_node_ready
  changed_when: false
  when:
    - not ansible_check_mode
    - k3s_bundled_cni | bool

# The counterpart for a k3s installed without its bundled CNI. Ready cannot
# happen until a CNI is installed on the cluster layer, so waiting for it here
# would time out on a server that is working exactly as configured. Registration
# is the most this layer can prove; roles/cilium owns the Ready wait.
- name: Wait for the node to register
  ansible.builtin.command: "{{ k3s_binary_path }} kubectl get node {{ inventory_hostname }}"
  register: k3s_node_registered
  until: k3s_node_registered.rc == 0
  retries: "{{ (k3s_ready_timeout | int) // 10 }}"
  delay: 10
  changed_when: false
  when:
    - not ansible_check_mode
    - not (k3s_bundled_cni | bool)

# --- kubeconfig for the login user -----------------------------------------
# So that `kubectl` works over SSH without sudo. The workstation gets its own
# copy through the kubeconfig role; this is purely for working on the box.
#
# The login user is asked for with become: false, deliberately. This play runs
# as root, so ansible_user_id — and every other identity fact — reports `root`,
# and the kubeconfig would land in /root/.kube where the SSH user cannot read
# it. The home directory is looked up rather than assumed to be under /home.
- name: Determine the login user
  ansible.builtin.command: id -un
  become: false
  register: k3s_login_user
  changed_when: false
  check_mode: false

- name: Look up the login user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ k3s_login_user.stdout | trim }}"

- name: Create the login user's kube directory
  ansible.builtin.file:
    path: "{{ k3s_login_home }}/.kube"
    state: directory
    owner: "{{ k3s_login_user.stdout | trim }}"
    group: "{{ k3s_login_user.stdout | trim }}"
    mode: "0700"
  vars:
    k3s_login_home: "{{ ansible_facts.getent_passwd[k3s_login_user.stdout | trim][4] }}"

- name: Install the kubeconfig for the login user
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig_path }}"
    dest: "{{ k3s_login_home }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_login_user.stdout | trim }}"
    group: "{{ k3s_login_user.stdout | trim }}"
    mode: "0600"
  vars:
    k3s_login_home: "{{ ansible_facts.getent_passwd[k3s_login_user.stdout | trim][4] }}"
  when: not ansible_check_mode
