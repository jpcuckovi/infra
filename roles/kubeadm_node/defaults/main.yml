# Defaults for kubeadm node prerequisites. Anything needing another node (init,
# join tokens) belongs to roles/kubeadm_control_plane.
---
# The pins live in group_vars/all.yml. Restated here so the role reads on its own.
kubernetes_version: "1.36.5"
kubernetes_package_revision: "1.1"

# pkgs.k8s.io has one repository per minor, so the URL is derived from the pin.
kubeadm_node_minor: "v{{ (kubernetes_version.split('.'))[:2] | join('.') }}"
kubeadm_node_repo_url: "https://pkgs.k8s.io/core:/stable:/{{ kubeadm_node_minor }}/deb/"

kubeadm_node_packages:
  - kubelet
  - kubeadm
  - kubectl

# From the same repository, but neither pinned nor held: cri-tools versions on
# its own (1.36.0 beside kubelet 1.36.5), and as a client it carries no skew
# risk. The per-minor repository keeps it on the cluster's minor.
kubeadm_node_tools:
  - cri-tools   # crictl, the CRI client the runbook and etcd snapshots use

# The bridge sysctls below do not exist until br_netfilter is loaded.
kubeadm_node_modules:
  - overlay
  - br_netfilter
kubeadm_node_modules_file: /etc/modules-load.d/kubeadm.conf

# Required by kubeadm's preflight; kept apart from roles/base's file because
# base applies to every machine.
kubeadm_node_sysctl_file: /etc/sysctl.d/70-kubeadm.conf
kubeadm_node_sysctl:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"
