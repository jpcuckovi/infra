# Node prerequisites for kubeadm. kubelet is left enabled and crash-looping,
# which is expected until `kubeadm init` or `join` gives it a configuration.
---
# ---- kernel ------------------------------------------------------------------

- name: Load the kernel modules kubeadm needs at boot
  ansible.builtin.copy:
    dest: "{{ kubeadm_node_modules_file }}"
    content: "{{ kubeadm_node_modules | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"

# modules-load.d is only read at boot, and the sysctls below need br_netfilter now.
- name: Load the kernel modules kubeadm needs now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kubeadm_node_modules }}"

- name: Apply the kubeadm kernel tunables
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ kubeadm_node_sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ kubeadm_node_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# ---- swap --------------------------------------------------------------------
# kubelet refuses to start with swap on; the Ubuntu Server installer creates
# /swap.img and an fstab line for it.

# fstab first, so a reboot between these tasks cannot bring swap back.
- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]\S*\s+\S+\s+swap\s.*)$'
    replace: '# disabled by infra (kubeadm_node): \1'

- name: Turn swap off
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0

# Only the installer's default file is removed; any other swap file is left
# alone, disabled by the fstab edit above.
- name: Remove the installer's swap file
  ansible.builtin.file:
    path: /swap.img
    state: absent

# ---- packages ----------------------------------------------------------------

# deb822_repository needs python3-debian, which Ubuntu Server lacks; without it
# the error names a library rather than the repository.
- name: Install the repository module's dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present

# Signed-By scopes the key to this repository rather than every source.
- name: Add the Kubernetes package repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "{{ kubeadm_node_repo_url }}"
    suites: /
    signed_by: "{{ kubeadm_node_repo_url }}Release.key"
    state: present
  register: kubeadm_node_repo

- name: Refresh the apt cache for the new repository
  ansible.builtin.apt:
    update_cache: true
  when: kubeadm_node_repo is changed

# Allowed through the hold below, or a pin bump stops with a held-packages error.
- name: Install the pinned kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name: >-
      {{ kubeadm_node_packages
         | map('regex_replace', '$', '=' ~ kubernetes_version ~ '-' ~ kubernetes_package_revision)
         | list }}
    state: present
    allow_change_held_packages: true
    allow_downgrade: false
  # Skipped under --check before the repository exists, since apt would have
  # no kubelet to find and the dry run would fail falsely.
  when: not (ansible_check_mode and kubeadm_node_repo is changed)

# Held so unattended upgrades cannot move one node to a new minor; upgrades go
# through a pin change and kubeadm's upgrade procedure.
- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubeadm_node_packages }}"
  # Same --check guard as the install.
  when: not (ansible_check_mode and kubeadm_node_repo is changed)

# Enabled, not started, since it cannot run until kubeadm configures it.
- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet.service
    enabled: true
  when: not ansible_check_mode
