# Merge a cluster into the workstation's kubeconfig under a named context.
# Replaces the per-repo kubeconfig.sh copies, for both k3s and kubeadm clusters.
---
kubeconfig_local_path: "{{ lookup('env', 'HOME') }}/.kube/config"

# k3s writes a kubeconfig pointing at 127.0.0.1, which is useless off the node;
# its certificate SANs carry the node's own address instead.
kubeconfig_api_port: 6443
