# Merge the cluster's kubeconfig into the workstation's under a chosen context
# name, never k3s's inherited `default`. A kubeadm admin.conf is read once, from
# one member, so several nodes never race on the workstation file.
---
- name: Settle which kind of cluster this is
  ansible.builtin.set_fact:
    kubeconfig_kubeadm: "{{ 'kubeadm_clusters' in group_names }}"

- name: Read the cluster's kubeconfig
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_path }}"
  register: kubeconfig_remote
  when:
    - not ansible_check_mode
    - not kubeconfig_kubeadm

- name: Rewrite the API address and the inherited names
  ansible.builtin.set_fact:
    kubeconfig_rendered: >-
      {{ kubeconfig_remote.content | b64decode
         | regex_replace('https://127\.0\.0\.1:' ~ kubeconfig_api_port,
                         'https://' ~ ansible_facts['default_ipv4']['address']
                         ~ ':' ~ kubeconfig_api_port)
         | regex_replace('(?m)^(\s*-?\s*)name: default$', '\1name: ' ~ kubeconfig_context)
         | regex_replace('(?m)^(\s*)cluster: default$', '\1cluster: ' ~ kubeconfig_context)
         | regex_replace('(?m)^(\s*)user: default$', '\1user: ' ~ kubeconfig_context)
         | regex_replace('(?m)^current-context: default$\n?', '') }}
  when:
    - not ansible_check_mode
    - not kubeconfig_kubeadm
  # Anchored per line: a global replace of `default` could corrupt the embedded
  # base64 certificates, which surfaces only as an obscure TLS error.
  # The `-?` is needed to catch the `- name: default` list item under users;
  # missing it leaves a context with no credentials (a 401 or a username prompt).

# ---- kubeadm ----------------------------------------------------------------
# Every kubeadm cluster names its user `kubernetes-admin`, so two merged configs
# would overwrite each other's credentials; all names become the context.
# The VIP server is asserted, then replaced by the endpoint name (in the SANs).

- name: Read admin.conf from a member
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: kubeconfig_remote
  # Ansible templates delegate_to before evaluating `when`, so without the
  # default this fails on k3s hosts where the task is skipped anyway.
  delegate_to: "{{ kubeadm_control_plane_api_host | default(inventory_hostname) }}"
  run_once: true
  when:
    - not ansible_check_mode
    - kubeconfig_kubeadm

- name: Assert admin.conf names the VIP, once
  ansible.builtin.assert:
    that:
      - kubeconfig_admin['clusters'] | length == 1
      - kubeconfig_admin['users'] | length == 1
      - kubeconfig_admin['clusters'][0]['cluster']['server']
        == 'https://' ~ kubeadm_control_plane_vip ~ ':' ~ kubeconfig_api_port
    fail_msg: >-
      admin.conf from {{ kubeadm_control_plane_api_host }} should hold one
      cluster and one user, with server https://{{ kubeadm_control_plane_vip }}:{{ kubeconfig_api_port }}.
      Found {{ kubeconfig_admin['clusters'] | length }} cluster(s), server
      {{ kubeconfig_admin['clusters'][0]['cluster']['server'] | default('none') }}.

      A different server means the cluster was initialised against a different
      controlPlaneEndpoint, and the VIP the workstation would be pointed at is
      not the one the cluster's certificates were issued for.
    success_msg: "admin.conf server is the VIP"
  run_once: true
  vars:
    kubeconfig_admin: "{{ kubeconfig_remote.content | b64decode | from_yaml }}"
  when:
    - not ansible_check_mode
    - kubeconfig_kubeadm

- name: Rename to the context and point at the endpoint's name
  ansible.builtin.set_fact:
    kubeconfig_rendered: >-
      {{ {'apiVersion': 'v1',
          'kind': 'Config',
          'preferences': {},
          'clusters': [{'name': kubeconfig_context,
                        'cluster': kubeconfig_admin['clusters'][0]['cluster']
                                   | combine({'server': 'https://' ~ kubeadm_control_plane_endpoint
                                                        ~ ':' ~ kubeconfig_api_port})}],
          'users': [{'name': kubeconfig_context,
                     'user': kubeconfig_admin['users'][0]['user']}],
          'contexts': [{'name': kubeconfig_context,
                        'context': {'cluster': kubeconfig_context,
                                    'user': kubeconfig_context}}]}
         | to_nice_yaml(indent=2) }}
  run_once: true
  no_log: true
  vars:
    kubeconfig_admin: "{{ kubeconfig_remote.content | b64decode | from_yaml }}"
  when:
    - not ansible_check_mode
    - kubeconfig_kubeadm
  # No current-context, so the fragment cannot take over the workstation's.


- name: Assert the rewritten kubeconfig carries credentials for the context
  run_once: "{{ kubeconfig_kubeadm }}"
  ansible.builtin.assert:
    that:
      - "'name: ' ~ kubeconfig_context in kubeconfig_rendered"
      - "'user: ' ~ kubeconfig_context in kubeconfig_rendered"
      - "'default' not in (kubeconfig_rendered | regex_findall('(?m)^\\s*-?\\s*name: (.+)$') | join(' '))"
    fail_msg: >-
      The rewritten kubeconfig still names `default` somewhere, or does not name
      {{ kubeconfig_context }} consistently across clusters, contexts and users.

      Merging it would install a context whose user cannot be resolved. The
      symptom downstream is a 401 from the API server, or kubectl prompting for
      a username — neither of which points back here.

      Names found: {{ kubeconfig_rendered | regex_findall('(?m)^\\s*-?\\s*name: (.+)$') }}
    success_msg: "kubeconfig renamed to '{{ kubeconfig_context }}' throughout"
  when: not ansible_check_mode
  # k3s uses the node IP, not its DNS name, because only the IP is in the SANs.
  # current-context is deleted: the fragment merges first and would otherwise win it.

- name: Ensure the workstation kube directory exists
  run_once: "{{ kubeconfig_kubeadm }}"
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Stage the renamed kubeconfig on the workstation
  run_once: "{{ kubeconfig_kubeadm }}"
  ansible.builtin.copy:
    content: "{{ kubeconfig_rendered }}"
    dest: "{{ kubeconfig_local_path | dirname }}/.infra-{{ kubeconfig_context }}.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode
  # Scaffolding created and removed within the run; reporting it as changed
  # would make the changed=0 second-run gate unreachable.
  changed_when: false

# No module wraps a kubeconfig merge; `config view --flatten` is the supported way.
# The fragment is listed first because kubectl is first-file-wins, so a reloaded
# host's new CA and address beat the stale entry for the context.
- name: Merge into the workstation kubeconfig
  run_once: "{{ kubeconfig_kubeadm }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      KUBECONFIG="{{ kubeconfig_local_path | dirname }}/.infra-{{ kubeconfig_context }}.yaml:{{ kubeconfig_local_path }}"
      kubectl config view --flatten
      > "{{ kubeconfig_local_path }}.merged"
      && if cmp -s "{{ kubeconfig_local_path }}.merged" "{{ kubeconfig_local_path }}";
         then rm -f "{{ kubeconfig_local_path }}.merged"; echo IDENTICAL;
         else mv "{{ kubeconfig_local_path }}.merged" "{{ kubeconfig_local_path }}"; echo REPLACED;
         fi
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: kubeconfig_merge
  # Compare before replacing so a converged run reports unchanged and keeps mtime.
  # Tokens avoid CHANGED/UNCHANGED, since `'CHANGED' in 'UNCHANGED'` is true.
  changed_when: "kubeconfig_merge.stdout | trim == 'REPLACED'"
  when: not ansible_check_mode

- name: Remove the staged fragment
  run_once: "{{ kubeconfig_kubeadm }}"
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}/.infra-{{ kubeconfig_context }}.yaml"
    state: absent
  delegate_to: localhost
  become: false
  # Scaffolding, as with the staging task above.
  changed_when: false

- name: Report the context
  run_once: "{{ kubeconfig_kubeadm }}"
  ansible.builtin.debug:
    msg: >-
      Cluster merged as context '{{ kubeconfig_context }}'. Reach it with
      `kubectl --context {{ kubeconfig_context }}`. The current-context of the
      workstation is deliberately not changed by this role.
