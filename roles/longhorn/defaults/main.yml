# Defaults for Longhorn, the cluster's replicated block storage. The host half
# (iSCSI, NFS client, data disk mount) is roles/longhorn_node.
---
longhorn_chart_repo_url: https://charts.longhorn.io
longhorn_release: longhorn
longhorn_namespace: longhorn-system

# Pinned in group_vars/all.yml; restated so the role reads on its own.
longhorn_version: "1.12.1"

# Both match the chart defaults; stated so a chart upgrade cannot change them.
longhorn_replicas: 3
longhorn_default_class: true

# Must match roles/longhorn_node's mount, or Longhorn writes to the boot drive.
longhorn_data_path: /var/lib/longhorn
