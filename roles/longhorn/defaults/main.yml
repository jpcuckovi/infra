# Longhorn, the cluster's replicated block storage, on the disks
# roles/longhorn_node prepared.
#
# A cluster capability, installed from the workstation after the CNI. Its host
# half — iSCSI, the NFS client, the data disk mounted at /var/lib/longhorn — is
# roles/longhorn_node, composed on every node in the host layer.
---
longhorn_chart_repo_url: https://charts.longhorn.io
longhorn_release: longhorn
longhorn_namespace: longhorn-system

# Pinned in group_vars/all.yml; restated so the role reads on its own.
longhorn_version: "1.12.1"

# Three replicas, one per node, and the cluster's default StorageClass. Both are
# the chart's defaults already; stated so a chart that changes its mind cannot
# change the cluster's with it.
longhorn_replicas: 3
longhorn_default_class: true

# Where replicas live. roles/longhorn_node mounts the data disk here; the two
# must agree, or Longhorn writes to the boot drive.
longhorn_data_path: /var/lib/longhorn
