# Host prerequisites for Longhorn's V1 data engine (per the v1.12 docs) and the
# dedicated data disk. The chart itself is a cluster role.
---
# cryptsetup is required on every node even without encrypted volumes. xfsprogs
# is listed explicitly because the filesystem module fails without it.
longhorn_node_packages:
  - open-iscsi
  - nfs-common
  - cryptsetup
  - dmsetup
  - parted
  - xfsprogs

# iscsi_tcp must load before iscsid starts. dm_crypt is preloaded so an encrypted
# volume's first attach does not depend on autoloading.
longhorn_node_modules:
  - iscsi_tcp
  - dm_crypt
longhorn_node_modules_file: /etc/modules-load.d/longhorn.conf

# Longhorn's default data path, so the chart needs no disk configuration: the
# data disk is mounted where Longhorn already looks.
longhorn_node_data_path: /var/lib/longhorn

# The label finds the disk on later runs and in fstab, since NVMe device names
# can swap between boots.
longhorn_node_fs_label: longhorn

# XFS suits a few large sparse replica files and reserves nothing, unlike ext4's
# 5% root reservation. The label must fit XFS's 12-character limit.
longhorn_node_fstype: xfs

# Longhorn's documented fix for multipathd claiming its /dev/sd* volumes, which
# shows up as "device is busy". The SER8s boot from NVMe, so no estate disk is sd*.
longhorn_node_multipath_conf: /etc/multipath/conf.d/longhorn.conf
