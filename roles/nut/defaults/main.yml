# Network UPS Tools: read a USB-attached UPS and shut hosts down cleanly when
# its battery runs low, on one host (standalone) or several (netserver/netclient).
---
# standalone  driver, upsd and upsmon on this host; nothing off it reads the UPS
# netserver   the same, with upsd also listening on the network
# netclient   upsmon only, watching a UPS served by nut_server_address
nut_mode: standalone

# netserver and netclient only. nut_server_host also names the workstation
# directory holding the shared password, so server and clients must agree on it.
nut_server_host: ""
nut_server_address: ""

# Every interface, because upsd fails to start if a named address does not exist
# yet, which at boot races DHCP. It replaces the loopback listener.
nut_server_listen_address: 0.0.0.0

# A secondary can attach and nothing more; forcing a shutdown needs the primary
# password, which never leaves the server.
nut_secondary_user: netclient

# On the workstation so a client can be configured while the server is down,
# and so an unmanaged host can be given the value.
nut_secondary_password_file: "{{ lookup('env', 'HOME') }}/.local/share/infra/nut/{{ nut_server_host }}/secondary-password"

# The name the UPS is known by: `upsc <name>@localhost`.
nut_ups_name: ups

# `port = auto` is required for USB and picks the first HID UPS, which is
# unambiguous with exactly one attached.
nut_driver: usbhid-ups
nut_port: auto

nut_listen_address: 127.0.0.1
nut_listen_port: 3493

# Whether the UPS cuts EVERY outlet after shutdown, so hosts reboot when mains
# returns. Off means a manual power-on; on also needs firmware power-on-after-AC-loss.
nut_killpower: false
nut_powerdown_flag: /etc/killpower

# Run on battery-low while on battery; the threshold is the UPS's own.
nut_shutdown_command: "/sbin/shutdown -h +0"

nut_packages:
  - nut-server
  - nut-client

nut_client_packages:
  - nut-client

nut_config_dir: /etc/nut
