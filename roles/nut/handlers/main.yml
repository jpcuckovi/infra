# Listed in dependency order (driver, server, monitor), which is the run order.
# All skip under --check, where the packages were only simulated.
---
# Regenerates the nut-driver@ units; a renamed or added UPS has none until then.
- name: Resync NUT driver units
  ansible.builtin.systemd_service:
    name: nut-driver-enumerator.service
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - nut_local_ups | bool

- name: Restart UPS driver
  ansible.builtin.systemd_service:
    name: "nut-driver@{{ nut_ups_name }}.service"
    state: restarted
  # The start task after the flush reports a missing device more clearly.
  failed_when: false
  when:
    - not ansible_check_mode
    - nut_local_ups | bool

- name: Restart NUT server
  ansible.builtin.systemd_service:
    name: nut-server.service
    state: restarted
  when:
    - not ansible_check_mode
    - nut_local_ups | bool

- name: Restart NUT monitor
  ansible.builtin.systemd_service:
    name: nut-monitor.service
    state: restarted
  when: not ansible_check_mode
