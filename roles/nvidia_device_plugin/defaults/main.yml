# Naming and timing for the GPU's cluster-side half. Chart versions live in
# inventory/group_vars/gpu_hosts.yml.
---
dcgm_release: dcgm-exporter

# Derived from the sharing mode, assuming one card per host; a multi-GPU host
# would override it together with the sharing values files' replica count.
nvidia_expected_gpu_count: "{{ 1 if nvidia_gpu_sharing == 'none' else 2 }}"

# First-pull budgets over a slow link; the dcgm image is over a gigabyte. An
# overrun leaves a release helm marks failed around a healthy workload.
nvidia_device_plugin_wait_timeout: "10m"
dcgm_wait_timeout: "20m"

# 60 attempts at 2s, covering the rollout and kubelet re-registration.
nvidia_capacity_retries: 60

# Required by name: a published gpu-bench finding rests on the profiling
# fields, and a chart upgrade could drop them silently.
dcgm_required_fields:
  - DCGM_FI_DEV_GPU_UTIL
  - DCGM_FI_DEV_FB_USED
  - DCGM_FI_PROF_DRAM_ACTIVE
  - DCGM_FI_PROF_PIPE_TENSOR_ACTIVE
  - DCGM_FI_PROF_GR_ENGINE_ACTIVE
