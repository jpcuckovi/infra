# The device plugin that makes nvidia.com/gpu schedulable, and dcgm-exporter.
# Composed after observability, whose CRDs the exporter's ServiceMonitor needs.
---
- name: Assert the nvidia RuntimeClass exists
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    api_version: node.k8s.io/v1
    kind: RuntimeClass
    name: nvidia
  register: nvidia_runtimeclass
  check_mode: false
  failed_when: nvidia_runtimeclass.resources | default([]) | length == 0
  # Fails rather than creating it: a missing RuntimeClass means k3s did not
  # detect the runtime, and creating one by hand would hide that.

# The chart's nodeAffinity needs this or an NFD label, else the DaemonSet wants
# 0 pods and `helm --wait` still reports success. NFD is unneeded on gpu_hosts.
- name: Label the node as carrying a GPU
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    kind: Node
    name: "{{ inventory_hostname }}"
    state: patched
    definition:
      metadata:
        labels:
          nvidia.com/gpu.present: "true"

# Must precede the install: without it the MPS daemon never schedules and pods
# fail at start, though the plugin advertises two GPUs.
- name: Label the node as MPS-capable
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    kind: Node
    name: "{{ inventory_hostname }}"
    state: patched
    definition:
      metadata:
        labels:
          nvidia.com/mps.capable: "true"
  when: nvidia_gpu_sharing == 'mps'

- name: Install the NVIDIA device plugin
  kubernetes.core.helm:
    context: "{{ kubeconfig_context }}"
    name: "{{ nvidia_device_plugin_release }}"
    chart_ref: nvidia-device-plugin
    chart_repo_url: https://nvidia.github.io/k8s-device-plugin
    chart_version: "{{ nvidia_device_plugin_chart_version }}"
    release_namespace: "{{ nvidia_device_plugin_namespace }}"
    create_namespace: true
    # Only one of these is set; a sharing mode's file is its whole configuration.
    values: "{{ {'runtimeClassName': 'nvidia'} if nvidia_gpu_sharing == 'none' else omit }}"
    values_files: "{{ [] if nvidia_gpu_sharing == 'none' else [nvidia_sharing_values_file] }}"
    wait: true
    wait_timeout: "{{ nvidia_device_plugin_wait_timeout }}"
  vars:
    nvidia_sharing_values_file: >-
      {{ role_path }}/../../charts/values/nvidia-device-plugin-{{ nvidia_gpu_sharing }}.yaml

- name: Install dcgm-exporter
  kubernetes.core.helm:
    context: "{{ kubeconfig_context }}"
    name: "{{ dcgm_release }}"
    chart_ref: dcgm-exporter
    chart_repo_url: https://nvidia.github.io/dcgm-exporter/helm-charts
    chart_version: "{{ dcgm_chart_version }}"
    release_namespace: "{{ observability_namespace }}"
    create_namespace: false
    values_files:
      - "{{ role_path }}/../../charts/values/dcgm-exporter.yaml"
    wait: true
    wait_timeout: "{{ dcgm_wait_timeout }}"

# Capacity lags helm while the plugin re-registers with kubelet.
- name: Wait for the node to advertise the expected GPU count
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    kind: Node
    name: "{{ inventory_hostname }}"
  register: nvidia_node
  until: >-
    (nvidia_node.resources | default([{}]) | first)
      .status.capacity['nvidia.com/gpu'] | default(0) | int
    == nvidia_expected_gpu_count | int
  retries: "{{ nvidia_capacity_retries }}"
  delay: 2
  when: not ansible_check_mode
  # Equality, not > 0, so a sharing-mode switch that did not take still fails.
