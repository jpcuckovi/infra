# Paths and probes for the NVIDIA host stack. Versions live in
# inventory/group_vars/gpu_hosts.yml, as a property of the hardware class.
---
# lspci, for the GPU probe. Not in base_packages, since only GPU hosts need it.
nvidia_runtime_packages:
  - pciutils

# Named once so the hold and its verify gate cannot disagree. Only the
# metapackages: the rest carry exact-version deps on them.
nvidia_held_packages: >-
  {{ ([nvidia_driver_package] if nvidia_driver_held | bool else [])
     + [nvidia_toolkit_package] }}

nvidia_toolkit_gpgkey_url: https://nvidia.github.io/libnvidia-container/gpgkey
nvidia_toolkit_keyring: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
nvidia_toolkit_sources_list: /etc/apt/sources.list.d/nvidia-container-toolkit.list
nvidia_toolkit_repo_base: https://nvidia.github.io/libnvidia-container/stable/deb

# Generous because a board with a lot of memory is slow to POST.
nvidia_reboot_timeout: 600

# Where k3s writes its generated containerd config. Read only.
nvidia_containerd_dir: /var/lib/rancher/k3s/agent/etc/containerd
