# NVIDIA driver and container toolkit, installed BEFORE k3s so k3s detects the
# runtime on first start. Writes no containerd config, CDI or RuntimeClass.
---
- name: Install the hardware inspection tools
  ansible.builtin.apt:
    name: "{{ nvidia_runtime_packages }}"
    state: present

# pciutils is installed first so a missing lspci cannot look like a missing GPU.
- name: Look for an NVIDIA GPU
  ansible.builtin.command: lspci
  register: nvidia_lspci
  changed_when: false
  check_mode: false

- name: Assert an NVIDIA GPU is present
  ansible.builtin.assert:
    that:
      - nvidia_lspci.stdout is search('(?i)nvidia')
    fail_msg: >-
      {{ inventory_hostname }} is in gpu_hosts but lspci reports no NVIDIA
      device.

      Either the card is absent or not seated, or the host does not belong in
      that group. This is asserted rather than skipped because a GPU host that
      silently builds without a GPU passes every later gate that matters — the
      device plugin advertises nothing, and the first workload to request
      nvidia.com/gpu simply stays Pending.
    success_msg: "{{ nvidia_lspci.stdout_lines | select('search', '(?i)nvidia') | first | trim }}"

# --- driver -----------------------------------------------------------------
- name: Check whether the driver is loaded
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_smi
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the installed driver package version
  ansible.builtin.command: "dpkg-query -W -f='${Version}' {{ nvidia_driver_package }}"
  register: nvidia_driver_pkg
  changed_when: false
  failed_when: false
  check_mode: false

# An unheld explicit version would be moved by apt and moved back by every run.
- name: Assert an explicit driver version is held
  ansible.builtin.assert:
    that:
      - nvidia_driver_version == 'latest' or nvidia_driver_held | bool
    fail_msg: >-
      nvidia_driver_version is {{ nvidia_driver_version }} but nvidia_driver_held
      is false. Set nvidia_driver_held to true with an explicit version, or set
      the version back to latest to follow the branch.
    quiet: true

# Guarded on the version, not on nvidia-smi answering. `latest` installs only
# when absent (newest at install time); a version is enforced in both directions.
- name: Install the driver
  ansible.builtin.apt:
    name: >-
      {{ nvidia_driver_package if nvidia_driver_version == 'latest'
         else nvidia_driver_package ~ '=' ~ nvidia_driver_version }}
    state: present
    update_cache: true
    allow_downgrade: "{{ nvidia_driver_version != 'latest' }}"
  when: >-
    nvidia_driver_pkg.rc != 0
    or (nvidia_driver_version != 'latest'
        and nvidia_driver_pkg.stdout | trim != nvidia_driver_version)
  register: nvidia_driver_installed

# modprobe first; the reboot below is only the fallback.
- name: Load the kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [nvidia, nvidia_modeset, nvidia_drm, nvidia_uvm]
  loop_control:
    label: "{{ item }}"
  when: nvidia_driver_installed is changed
  failed_when: false

- name: Re-check the driver after loading the modules
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_smi_post
  changed_when: false
  failed_when: false
  check_mode: false
  when: nvidia_driver_installed is changed

# Needed mainly when a different driver was already loaded in the running kernel.
- name: Reboot to load the driver
  ansible.builtin.reboot:
    reboot_timeout: "{{ nvidia_reboot_timeout }}"
    msg: "Rebooting to load the NVIDIA driver (ansible, roles/nvidia_runtime)"
  when:
    - nvidia_driver_installed is changed
    - nvidia_smi_post.rc | default(1) != 0
    - not ansible_check_mode

- name: Read the driver version
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_smi_final
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the driver is loaded and new enough for this hardware
  ansible.builtin.assert:
    that:
      - nvidia_smi_final.rc == 0
      - nvidia_driver_major | int >= nvidia_driver_min_major | int
    fail_msg: >-
      nvidia-smi reports
      '{{ nvidia_smi_final.stdout | default("nothing") | trim }}'
      (exit {{ nvidia_smi_final.rc | default("?") }}); this hardware needs
      R{{ nvidia_driver_min_major }} or newer.

      Below that floor the driver loads, the GPU is schedulable, and CUDA
      kernels fail at RUNTIME with "no kernel image is available for execution"
      — which reads as a broken build rather than a driver problem, on a machine
      where every check here passed.
    success_msg: "driver {{ nvidia_smi_final.stdout | default('') | trim }}"
  vars:
    # Split, not regex_search, whose None on odd input crashes the gate.
    nvidia_driver_major: >-
      {{ nvidia_smi_final.stdout | default('0') | trim
         | split('.') | first | default('0', true) }}

# --- container toolkit ------------------------------------------------------
- name: Check whether the container toolkit is present
  ansible.builtin.command: nvidia-ctk --version
  register: nvidia_ctk
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fetch the libnvidia-container signing key
  ansible.builtin.get_url:
    url: "{{ nvidia_toolkit_gpgkey_url }}"
    dest: /tmp/nvidia-container-toolkit.gpgkey
    mode: "0644"
  when: nvidia_ctk.rc != 0

- name: Dearmor the signing key into the keyring
  ansible.builtin.command: >-
    gpg --dearmor -o {{ nvidia_toolkit_keyring }}
    /tmp/nvidia-container-toolkit.gpgkey
  args:
    creates: "{{ nvidia_toolkit_keyring }}"
  when: nvidia_ctk.rc != 0

# The apt source is templated so --check --diff shows it, and the architecture
# comes from dpkg so an arm64 GPU host also works.
- name: Determine the package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: nvidia_deb_arch
  changed_when: false
  check_mode: false

- name: Add the libnvidia-container apt source
  ansible.builtin.template:
    src: nvidia-container-toolkit.list.j2
    dest: "{{ nvidia_toolkit_sources_list }}"
    owner: root
    group: root
    mode: "0644"
  when: nvidia_ctk.rc != 0
  register: nvidia_toolkit_source

- name: Read the installed toolkit package version
  ansible.builtin.command: "dpkg-query -W -f='${Version}' {{ nvidia_toolkit_package }}"
  register: nvidia_toolkit_pkg
  changed_when: false
  failed_when: false
  check_mode: false

# Same two modes as the driver.
- name: Install the container toolkit
  ansible.builtin.apt:
    name: >-
      {{ nvidia_toolkit_package if nvidia_toolkit_version == 'latest'
         else nvidia_toolkit_package ~ '=' ~ nvidia_toolkit_version }}
    state: present
    update_cache: "{{ nvidia_toolkit_source is changed }}"
    allow_downgrade: "{{ nvidia_toolkit_version != 'latest' }}"
  when: >-
    nvidia_toolkit_pkg.rc != 0
    or (nvidia_toolkit_version != 'latest'
        and nvidia_toolkit_pkg.stdout | trim != nvidia_toolkit_version)

# --- holds ------------------------------------------------------------------
# Without a hold, `apt upgrade` silently moves a package away from its
# declaration. Holding a metapackage keeps its exact-version deps back.
- name: Hold the packages that must not move
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ nvidia_held_packages }}"
  loop_control:
    label: "{{ item }}"

# Released explicitly, so a hold from an earlier run cannot outlive the decision
# to follow the branch.
- name: Release the driver to follow its branch
  ansible.builtin.dpkg_selections:
    name: "{{ nvidia_driver_package }}"
    selection: install
  when: not nvidia_driver_held | bool
