# Gates for the NVIDIA host stack. The last one, that k3s picked up the
# runtime, is the one that proves the GPU is usable from a container.
---
- name: Read the driver version
  ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: nvidia_smi_gate
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the driver is loaded and new enough for this hardware
  ansible.builtin.assert:
    that:
      - nvidia_smi_gate.rc == 0
      - nvidia_driver_major | int >= nvidia_driver_min_major | int
    fail_msg: >-
      nvidia-smi reports '{{ nvidia_smi_gate.stdout | default("nothing") | trim }}'
      (exit {{ nvidia_smi_gate.rc | default("?") }}); this hardware needs
      R{{ nvidia_driver_min_major }} or newer.
    success_msg: "driver {{ nvidia_smi_gate.stdout | default('') | trim }}"
  vars:
    nvidia_driver_major: >-
      {{ nvidia_smi_gate.stdout | default('0') | trim
         | split('.') | first | default('0', true) }}

- name: Check the container toolkit
  ansible.builtin.command: nvidia-ctk --version
  register: nvidia_ctk_gate
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the container toolkit is installed
  ansible.builtin.assert:
    that:
      - nvidia_ctk_gate.rc == 0
    fail_msg: >-
      nvidia-ctk is not on PATH. Without it k3s has no nvidia-container-runtime
      to detect, so containerd gets no nvidia runtime and every pod requesting
      the GPU fails at start with an unknown runtime class.
    success_msg: "{{ nvidia_ctk_gate.stdout_lines | first | default('nvidia-ctk present') | trim }}"

# --- the versions are what they say they are ---------------------------------
# The driver gate above checks only the hardware's minimum major, so drift from
# the declared version is caught here.
- name: Read which packages are held
  ansible.builtin.command: apt-mark showhold
  register: nvidia_holds
  changed_when: false
  check_mode: false

- name: Read the installed versions of the pinned NVIDIA packages
  ansible.builtin.command: >-
    dpkg-query -W -f='${Package}=${Version}\n'
    {{ nvidia_driver_package }} {{ nvidia_toolkit_package }}
  register: nvidia_pkg_versions
  changed_when: false
  failed_when: false
  check_mode: false

# `apt-mark showhold` lists one name per line, so this is a list membership test.
- name: Assert the packages that must not move are held
  ansible.builtin.assert:
    that:
      - nvidia_unheld | length == 0
    fail_msg: >-
      Not held: {{ nvidia_unheld | join(', ') }}.

      Without a hold these packages move on the next `apt upgrade`, and nothing
      here would notice: the install task skips when the version already matches,
      and the driver gate above only checks a minimum major. The file would go on
      declaring one version while the machine ran another — and gpu-bench's
      artifacts record the driver as a fact about the substrate a campaign
      measured.

      roles/nvidia_runtime applies the hold, so this failing means that task was
      skipped or something released it:  sudo apt-mark showhold
    success_msg: "held: {{ nvidia_held_packages | join(', ') }}"
  vars:
    nvidia_unheld: >-
      {{ nvidia_held_packages | reject('in', nvidia_holds.stdout_lines) | list }}

# The other direction: a leftover hold would freeze the driver while its kernel
# moves on, and the GPU would vanish at a later reboot.
- name: Assert the driver follows its branch
  ansible.builtin.assert:
    that:
      - nvidia_driver_package not in nvidia_holds.stdout_lines
    fail_msg: >-
      {{ nvidia_driver_package }} is held, but nvidia_driver_held is false.
      Rerun the main playbook to release it, or:  sudo apt-mark unhold {{ nvidia_driver_package }}
    success_msg: "{{ nvidia_driver_package }} follows its branch"
  when: not nvidia_driver_held | bool

# Passes trivially under `latest`, where the hold is the only constraint.
- name: Assert the installed versions match the declared ones
  ansible.builtin.assert:
    that:
      - nvidia_driver_declared_ok
      - nvidia_toolkit_declared_ok
    fail_msg: >-
      Declared versions do not match what is installed.

      driver:   declared {{ nvidia_driver_version }},
                installed {{ nvidia_installed_driver | default('absent', true) }}
      toolkit:  declared {{ nvidia_toolkit_version }},
                installed {{ nvidia_installed_toolkit | default('absent', true) }}

      A pin that cannot be contradicted is not a pin. This is the assert that
      contradicts it.
    success_msg: >-
      versions match declaration
      (driver {{ nvidia_driver_version }}, toolkit {{ nvidia_toolkit_version }})
  vars:
    # name=version lines become a dict.
    nvidia_installed: >-
      {{ dict(nvidia_pkg_versions.stdout_lines | default([])
              | map('split', '=', 1) | list) }}
    nvidia_installed_driver: "{{ nvidia_installed[nvidia_driver_package] | default('') }}"
    nvidia_installed_toolkit: "{{ nvidia_installed[nvidia_toolkit_package] | default('') }}"
    nvidia_driver_declared_ok: >-
      {{ true if nvidia_driver_version == 'latest'
         else nvidia_installed_driver == nvidia_driver_version }}
    nvidia_toolkit_declared_ok: >-
      {{ true if nvidia_toolkit_version == 'latest'
         else nvidia_installed_toolkit == nvidia_toolkit_version }}

# k3s regenerates this config on every start, so it shows what k3s decided. A
# toolkit installed after k3s started is absent here until k3s restarts.
- name: Read the containerd configuration k3s generated
  ansible.builtin.find:
    paths: "{{ nvidia_containerd_dir }}"
    patterns: "config*.toml"
    file_type: file
  register: nvidia_containerd_files
  check_mode: false

- name: Look for the nvidia runtime in it
  ansible.builtin.command: "grep -ril nvidia {{ item.path }}"
  register: nvidia_containerd_grep
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ nvidia_containerd_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Assert k3s registered the nvidia runtime with containerd
  ansible.builtin.assert:
    that:
      - nvidia_containerd_files.files | length > 0
      - nvidia_containerd_grep.results | selectattr('rc', 'equalto', 0) | list | length > 0
    fail_msg: >-
      No nvidia runtime in k3s's generated containerd config under
      {{ nvidia_containerd_dir }}.

      k3s scans PATH for nvidia-container-runtime ONCE, when it starts, and
      writes the runtime into the config it generates. A toolkit installed after
      k3s first started is invisible to it until a restart — the node stays
      Ready, the device plugin may even advertise a GPU, and pods requesting the
      nvidia runtime class fail at start.

      Fix by restarting k3s deliberately: sudo systemctl restart k3s
      Prevent it by composing nvidia_runtime before k3s_server, which
      playbooks/_layers.yml asserts.
    success_msg: "k3s registered the nvidia runtime"
