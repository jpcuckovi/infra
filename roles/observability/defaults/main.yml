# Defaults for Jaeger, kube-prometheus-stack, and the discovery contract that
# lets agent repos find both. This role is their single owner and writer.
---
observability_namespace: observability

# ---- what this host runs, versus what it sends elsewhere -------------------
# Each flag guards something that should exist once in the estate. All default
# to true for the shared services host; lab nodes turn them off in host_vars.

# One Jaeger, on the durable host, so traces are not split across UIs.
observability_jaeger_enabled: true

# One Grafana, which sees every cluster through VictoriaMetrics by its `cluster`
# label. When false, the host still runs Prometheus and its exporters.
observability_grafana_enabled: true

# One answer per estate for where agents send telemetry, so exactly one host
# may write these files.
observability_write_discovery_contract: true

# Matches the chart name so resource names drop the release prefix. Renaming it
# renames every resource and means `helm uninstall`, a rebuild and orphaned PVCs.
observability_release: kube-prometheus-stack

# ---- where this cluster ships its history ---------------------------------
# The store's own cluster writes over the in-cluster Service, avoiding a
# NodePort hairpin; every other cluster uses the CNAME.
prometheus_remote_write_url: >-
  {{ ('http://' ~ victoriametrics_name ~ '.' ~ victoriametrics_namespace
      ~ '.svc:' ~ victoriametrics_port ~ '/api/v1/write')
     if 'metrics_stores' in group_names
     else ('http://' ~ metrics_alias ~ ':' ~ victoriametrics_node_port
           ~ '/api/v1/write') }}

# ---- local Prometheus ------------------------------------------------------
# A scrape buffer sized for its retention window; history lives in VictoriaMetrics.
prometheus_retention: 24h
prometheus_retention_size: 15GB
prometheus_storage_size: 20Gi

# Overridden on adopted clusters to match what exists, because a StatefulSet's
# volume claim cannot change in place and the wrong class breaks the upgrade.
prometheus_storage_class: local-path

prometheus_resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

prometheus_operator_resources:
  requests:
    cpu: 50m
    memory: 128Mi

grafana_resources:
  requests:
    cpu: 50m
    # Near the ~300Mi steady state, so the scheduler does not overcommit the node.
    memory: 256Mi
  limits:
    # The chart's 256Mi default is below Grafana's ~300Mi steady state and OOMKills.
    memory: 512Mi

# ---- Jaeger ----------------------------------------------------------------
jaeger_storage_size: 20Gi
jaeger_resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # Generous because Badger memory-maps its store.
    memory: 1500Mi

# ---- the discovery contract ------------------------------------------------
# Written on the workstation, where the agent repos that read it run.
observability_config_dir: "{{ lookup('env', 'XDG_CONFIG_HOME') | default(lookup('env', 'HOME') ~ '/.config', true) }}/diag-agents"

# Kept in gitignored .ansible/ rather than a tempfile, so the exact values helm
# received survive a failed install for inspection.
observability_render_dir: "{{ role_path }}/../../.ansible"
observability_values_render_path: "{{ observability_render_dir }}/host-values-{{ inventory_hostname }}.yaml"
