# Installs traces, metrics and the discovery contract. Runs after
# victoriametrics so Prometheus has a remote_write target from the start.
---
- name: Ensure the observability namespace exists
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ observability_namespace }}"
  # Never deleted, because the namespace is shared with workloads this role does not own.

# --- Jaeger -----------------------------------------------------------------
# One Jaeger serves the estate from the durable host; lab nodes run none.
- name: Apply the Jaeger pipeline configuration
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: jaeger-config
        namespace: "{{ observability_namespace }}"
      data:
        jaeger-config.yaml: "{{ lookup('file', 'jaeger-config.yaml') }}"
    apply: true
  when: observability_jaeger_enabled | bool

- name: Apply Jaeger
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    definition: "{{ lookup('template', 'jaeger.yaml.j2') | from_yaml_all | list }}"
    apply: true
    wait: true
    wait_timeout: 300
  when: observability_jaeger_enabled | bool

# --- kube-prometheus-stack --------------------------------------------------
- name: Ensure the render directory exists
  ansible.builtin.file:
    path: "{{ observability_render_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Render the per-host values overlay
  ansible.builtin.template:
    src: host-values.yaml.j2
    dest: "{{ observability_values_render_path }}"
    mode: "0644"
  delegate_to: localhost
  register: obs_host_values
  # Kept on disk, not in a tempfile, so a failed install's values can be read.

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    context: "{{ kubeconfig_context }}"
    name: "{{ observability_release }}"
    chart_ref: kube-prometheus-stack
    chart_repo_url: https://prometheus-community.github.io/helm-charts
    chart_version: "{{ kube_prometheus_stack_version }}"
    release_namespace: "{{ observability_namespace }}"
    create_namespace: false
    # Later wins: the per-host overlay overrides the shared base.
    values_files:
      - "{{ role_path }}/../../charts/values/kube-prometheus-stack.base.yaml"
      - "{{ observability_values_render_path }}"
    wait: true
    wait_timeout: "15m"

# --- the discovery contract -------------------------------------------------
# Addresses are asked of the cluster, not stored in git, so they survive DHCP moves.
# Dashboards ship only where Grafana runs; its sidecar picks them up by label.
- name: Find the dashboards to publish
  ansible.builtin.find:
    paths: "{{ role_path }}/files/dashboards"
    patterns: "*.json"
  register: obs_dashboards
  delegate_to: localhost
  check_mode: false
  when: observability_grafana_enabled | bool

- name: Apply the Grafana dashboards
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "dashboard-{{ item.path | basename | splitext | first }}"
        namespace: "{{ observability_namespace }}"
        labels:
          grafana_dashboard: "1"
      # One expression, because ansible-core 2.19 no longer templates dict keys
      # in task arguments and the literal key would be rejected.
      data: "{{ {item.path | basename: lookup('ansible.builtin.file', item.path)} }}"
  loop: "{{ obs_dashboards.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: observability_grafana_enabled | bool

- name: Ask the cluster for a node address
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    kind: Node
  register: obs_nodes
  check_mode: false

- name: Resolve the node's internal address
  ansible.builtin.set_fact:
    obs_node_ip: >-
      {{ obs_nodes.resources[0].status.addresses
         | selectattr('type', 'equalto', 'InternalIP')
         | map(attribute='address') | first }}

- name: Ensure the consumer configuration directory exists
  ansible.builtin.file:
    path: "{{ observability_config_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  when: observability_write_discovery_contract | bool

# Only one host may write these: a second writer would overwrite them each run
# and the two hosts would fail each other's verify gates. Readers check
# AGENT_OTLP_ENDPOINT / AGENT_PROM_URL first, then these files.
- name: Record the OTLP endpoint
  ansible.builtin.copy:
    content: "{{ obs_node_ip }}:{{ jaeger_otlp_http_node_port }}\n"
    dest: "{{ observability_config_dir }}/otlp-endpoint"
    mode: "0644"
  delegate_to: localhost
  when: observability_write_discovery_contract | bool

- name: Record the Prometheus URL
  ansible.builtin.copy:
    content: "http://{{ obs_node_ip }}:{{ prometheus_node_port }}\n"
    dest: "{{ observability_config_dir }}/prometheus-url"
    mode: "0644"
  delegate_to: localhost
  when: observability_write_discovery_contract | bool

- name: Report the published endpoints
  ansible.builtin.debug:
    msg: "{{ obs_published }}"
  vars:
    obs_published: >-
      {{ ['prometheus      http://' ~ obs_node_ip ~ ':' ~ prometheus_node_port]
         + (['grafana         http://' ~ obs_node_ip ~ ':' ~ grafana_node_port]
            if observability_grafana_enabled | bool else [])
         + (['jaeger ui       http://' ~ obs_node_ip ~ ':' ~ jaeger_ui_node_port]
            if observability_jaeger_enabled | bool else [])
         + ['victoriametrics http://' ~ metrics_alias ~ ':' ~ victoriametrics_node_port] }}
