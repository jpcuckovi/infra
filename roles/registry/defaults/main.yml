# Defaults for the registry this host serves. registry_alias and registry_port
# live in group_vars/all.yml because roles/registry_mirror needs them too.
---
registry_root: /srv/registry
registry_container_name: local-registry
registry_unit_path: /etc/systemd/system/local-registry.service

# Not loopback: a loopback-bound registry passes local checks and surfaces only
# later as an ImagePullBackOff on another machine.
registry_bind_address: "0.0.0.0"
