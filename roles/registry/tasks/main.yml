# Runs the registry service on the one host that serves images. Pull config is
# roles/registry_mirror; only that role must precede k3s_server.
---
- name: Create the registry storage root
  ansible.builtin.file:
    path: "{{ registry_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether the registry image is already present
  ansible.builtin.command: "podman image exists {{ registry_image }}"
  register: registry_image_present
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pull the registry image
  ansible.builtin.command: "podman pull {{ registry_image }}"
  when: registry_image_present.rc != 0
  changed_when: true

- name: Install the registry unit
  ansible.builtin.template:
    src: local-registry.service.j2
    dest: "{{ registry_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart local-registry

- name: Enable and start the registry
  ansible.builtin.systemd_service:
    name: local-registry
    state: started
    enabled: true
    daemon_reload: true
  # Under --check the unit was never written, so this would fail with "Could not
  # find the requested service" and abort the dry run.
  when: not ansible_check_mode

# The readiness check is meaningless against the pre-restart container.
- name: Apply pending restarts before checking readiness
  ansible.builtin.meta: flush_handlers

- name: Wait for the registry to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ registry_port }}/v2/"
    status_code: [200, 401]
  register: registry_ready
  retries: 10
  delay: 2
  until: registry_ready is succeeded
  # Under --check nothing was installed, so there is nothing to wait for.
  when: not ansible_check_mode
