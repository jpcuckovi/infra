# Where the mirror config is written, and whether writing it may restart k3s.
# The registry's address is estate-wide, in inventory/group_vars/all.yml.
---
k3s_registries_yaml: /etc/rancher/k3s/registries.yaml

# False because a restart bounces every pod on the node (see ARCHITECTURE.md).
# Normally this role runs before k3s exists, so it rarely matters.
registry_restart_k3s_on_change: false
