# For a mirror config change on a host where k3s is already running. Exactly one
# fires, chosen by registry_restart_k3s_on_change.
---
# k3s reads registries.yaml only at start, so a running k3s ignores the change
# until restarted.
- name: Restart k3s to read the mirror config
  ansible.builtin.systemd_service:
    name: k3s
    state: restarted
  when:
    - registry_k3s_running | bool
    - registry_restart_k3s_on_change | bool

- name: Report that k3s has not read the new mirror config
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ k3s_registries_yaml }} changed while k3s was already running.
      k3s read the old configuration at start, so pulls from
      {{ registry_alias }}:{{ registry_port }} will fail until it is restarted.

      This run did NOT restart it, because that bounces every pod on the node
      and is not something to do as a side effect. Restart deliberately with:
        sudo systemctl restart k3s
      or re-run with -e registry_restart_k3s_on_change=true
  when:
    - registry_k3s_running | bool
    - not (registry_restart_k3s_on_change | bool)
