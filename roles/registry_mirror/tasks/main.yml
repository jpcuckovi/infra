# Writes the containerd mirror config on every k3s host, including the registry
# host. Runs before k3s_server, which reads the file only at first start.
---
- name: Record whether k3s is already running
  ansible.builtin.command: systemctl is-active k3s
  register: registry_k3s_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set the k3s-running fact
  ansible.builtin.set_fact:
    registry_k3s_running: "{{ registry_k3s_active.stdout | trim == 'active' }}"

# Created unconditionally: on a fresh host the directory does not exist yet, and
# skipping the write would silently send every pull upstream.
- name: Ensure the k3s configuration directory exists
  ansible.builtin.file:
    path: "{{ k3s_registries_yaml | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the containerd mirror configuration
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: "{{ k3s_registries_yaml }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart k3s to read the mirror config
    - Report that k3s has not read the new mirror config
