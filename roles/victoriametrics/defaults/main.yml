# Defaults for the estate's long-term metrics store: single-node
# VictoriaMetrics, which every host's Prometheus remote-writes into.
---
victoriametrics_name: victoriametrics
victoriametrics_namespace: "{{ observability_namespace | default('observability') }}"
victoriametrics_port: 8428

# victoriametrics_retention_period and victoriametrics_storage_size are required
# per host, with no default; roles/preflight asserts both. Bare retention is months.

victoriametrics_resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi
