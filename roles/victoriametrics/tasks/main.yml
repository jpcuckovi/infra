# Installs the long-term metrics store; runs before observability so Prometheus
# has a remote-write target from its first sample.
---
- name: Ensure the observability namespace exists
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ victoriametrics_namespace }}"
  # Never deleted: the namespace is shared, and ensuring it here lets this role
  # run standalone.

- name: Apply VictoriaMetrics
  kubernetes.core.k8s:
    context: "{{ kubeconfig_context }}"
    state: present
    definition: "{{ lookup('template', 'victoriametrics.yaml.j2') | from_yaml_all | list }}"
    apply: true
    wait: true
    wait_timeout: 300

- name: Wait for VictoriaMetrics to become available
  kubernetes.core.k8s_info:
    context: "{{ kubeconfig_context }}"
    kind: Deployment
    name: "{{ victoriametrics_name }}"
    namespace: "{{ victoriametrics_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  when: not ansible_check_mode
