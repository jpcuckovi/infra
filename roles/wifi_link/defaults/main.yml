# Defaults for keeping a wireless host reachable. Interfaces are discovered, not
# named, because the estate's chipsets name them differently.
---
# Empty means discover. Override in host_vars only to pin a subset, such as one
# of two radios.
wifi_link_interfaces: []

# Here rather than in base_packages, so wired hosts do not install it.
wifi_link_packages:
  - iw

wifi_link_unit_path: /etc/systemd/system/wifi-powersave@.service
