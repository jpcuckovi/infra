# Disables power save on every wireless interface of a wifi_hosts member. A
# sleeping radio can miss a reassociation and leave the host up but unreachable.
---
- name: Install the wireless tools
  ansible.builtin.apt:
    name: "{{ wifi_link_packages }}"
    state: present

# A `wireless` directory marks a wireless interface on any driver, unlike names.
# follow is required because /sys/class/net entries are symlinks.
- name: Discover the wireless interfaces
  ansible.builtin.find:
    paths: /sys/class/net
    patterns: wireless
    file_type: directory
    recurse: true
    depth: 2
    follow: true
  register: wifi_link_found
  check_mode: false

- name: Settle the interface list
  ansible.builtin.set_fact:
    wifi_link_managed: >-
      {{ wifi_link_interfaces
         if (wifi_link_interfaces | length > 0)
         else (wifi_link_found.files | map(attribute='path')
               | map('dirname') | map('basename') | list) }}

- name: Assert a wireless interface was found
  ansible.builtin.assert:
    that:
      - wifi_link_managed | length > 0
    fail_msg: >-
      {{ inventory_hostname }} is in wifi_hosts but carries no wireless
      interface — nothing under /sys/class/net has a `wireless` directory.

      Either the host is wired and should leave that group, or its driver failed
      to load and the radio is absent rather than merely down. `ip link` will
      show the interface in the second case and not in the first.
    success_msg: "wireless interfaces: {{ wifi_link_managed | join(', ') }}"

- name: Install the power-save unit
  ansible.builtin.template:
    src: wifi-powersave@.service.j2
    dest: "{{ wifi_link_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  register: wifi_link_unit

- name: Enable and start power-save suppression per interface
  ansible.builtin.systemd_service:
    name: "wifi-powersave@{{ item }}.service"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ wifi_link_managed }}"
  loop_control:
    label: "{{ item }}"
  # Under --check the template unit was never written, so this would fail.
  when: not ansible_check_mode

# An already-enabled unit is left alone by `enabled: true`, so a changed
# [Install] section needs a reenable to create its new links.
- name: Re-enable power-save suppression after the unit's install targets change
  ansible.builtin.command: "systemctl reenable wifi-powersave@{{ item }}.service"
  loop: "{{ wifi_link_managed }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - wifi_link_unit is changed
