# Keeps a wired link from parking itself in EEE idle; the counterpart to
# wifi_link. Interfaces are discovered, never named.
---
# Empty means discover from /sys/class/net. Set in host_vars only to pin a
# subset, such as the one port of two that carries the LAN.
wired_link_interfaces: []

# Here, not in base_packages: only cabled machines need it (as wifi_link does with iw).
wired_link_packages:
  - ethtool

wired_link_unit_path: /etc/systemd/system/eee-off@.service
wired_link_aspm_unit_path: /etc/systemd/system/aspm-l1-off@.service
