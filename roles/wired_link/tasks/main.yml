# Disable Energy-Efficient Ethernet on every wired interface (wired_hosts only).
# EEE wake on bcmgenet drops a packet, and in idle interactive traffic that
# becomes a multi-second RTO stall while bulk throughput looks healthy.
# Also disable PCIe ASPM L1 on each NIC's link, which an Intel I226 can fail to
# wake from, detaching the NIC until a reboot.
---
- name: Install the wired tools
  ansible.builtin.apt:
    name: "{{ wired_link_packages }}"
    state: present

# Wired means a `device` entry (real hardware, so no lo, veth or cni0) minus
# those with a `wireless` directory. follow is needed: /sys/class/net is symlinks.
- name: Discover the hardware-backed interfaces
  ansible.builtin.find:
    paths: /sys/class/net
    patterns: device
    file_type: any
    recurse: true
    depth: 2
    follow: true
  register: wired_link_hardware
  check_mode: false

- name: Discover the wireless interfaces
  ansible.builtin.find:
    paths: /sys/class/net
    patterns: wireless
    file_type: directory
    recurse: true
    depth: 2
    follow: true
  register: wired_link_radios
  check_mode: false

- name: Settle the interface list
  ansible.builtin.set_fact:
    wired_link_managed: >-
      {{ wired_link_interfaces
         if (wired_link_interfaces | length > 0)
         else ((wired_link_hardware.files | map(attribute='path')
                | map('dirname') | map('basename') | list)
               | difference(wired_link_radios.files | map(attribute='path')
                            | map('dirname') | map('basename') | list)) }}

- name: Assert a wired interface was found
  ansible.builtin.assert:
    that:
      - wired_link_managed | length > 0
    fail_msg: >-
      {{ inventory_hostname }} is in wired_hosts but carries no wired interface —
      nothing under /sys/class/net has a `device` entry without also having a
      `wireless` directory.

      Either the host is wireless-only and should leave that group, or its NIC
      driver failed to load and the interface is absent rather than merely down.
      `ip link` will show the interface in the second case and not in the first.
    success_msg: "wired interfaces: {{ wired_link_managed | join(', ') }}"

- name: Install the EEE-suppression unit
  ansible.builtin.template:
    src: eee-off@.service.j2
    dest: "{{ wired_link_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  register: wired_link_unit

- name: Enable and start EEE suppression per interface
  ansible.builtin.systemd_service:
    name: "eee-off@{{ item }}.service"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ wired_link_managed }}"
  loop_control:
    label: "{{ item }}"
  # Under --check the unit was only simulated, so there is no template to start.
  when: not ansible_check_mode

# An already-enabled unit is left alone by `enabled: true`, so a changed
# [Install] section needs a reenable to create its new links.
- name: Re-enable EEE suppression after the unit's install targets change
  ansible.builtin.command: "systemctl reenable eee-off@{{ item }}.service"
  loop: "{{ wired_link_managed }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - wired_link_unit is changed

- name: Install the ASPM L1 suppression unit
  ansible.builtin.template:
    src: aspm-l1-off@.service.j2
    dest: "{{ wired_link_aspm_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  register: wired_link_aspm_unit

# Every wired interface, PCIe or not: the unit itself skips a NIC with no
# link/l1_aspm control, so the role needs no knowledge of the bus.
- name: Enable and start ASPM L1 suppression per interface
  ansible.builtin.systemd_service:
    name: "aspm-l1-off@{{ item }}.service"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ wired_link_managed }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

# systemd_service has no reenable, so this one stays a command.
- name: Re-enable ASPM L1 suppression after the unit's install targets change  # noqa: command-instead-of-module
  ansible.builtin.command: "systemctl reenable aspm-l1-off@{{ item }}.service"
  loop: "{{ wired_link_managed }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - wired_link_aspm_unit is changed
