# Gates for the wired link. Asks the PHY via ethtool, not the unit, since EEE
# is renegotiated whenever the link comes up.
---
- name: Discover the hardware-backed interfaces
  ansible.builtin.find:
    paths: /sys/class/net
    patterns: device
    file_type: any
    recurse: true
    depth: 2
    follow: true
  register: wired_link_hardware
  check_mode: false

- name: Discover the wireless interfaces
  ansible.builtin.find:
    paths: /sys/class/net
    patterns: wireless
    file_type: directory
    recurse: true
    depth: 2
    follow: true
  register: wired_link_radios
  check_mode: false

- name: Settle the interface list
  ansible.builtin.set_fact:
    wired_link_managed: >-
      {{ wired_link_interfaces
         if (wired_link_interfaces | length > 0)
         else ((wired_link_hardware.files | map(attribute='path')
                | map('dirname') | map('basename') | list)
               | difference(wired_link_radios.files | map(attribute='path')
                            | map('dirname') | map('basename') | list)) }}

- name: Read the EEE state of each interface
  ansible.builtin.command: "ethtool --show-eee {{ item }}"
  register: wired_link_state
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ wired_link_managed }}"
  loop_control:
    label: "{{ item }}"

- name: Assert EEE is off on every wired interface
  ansible.builtin.assert:
    that:
      - wired_link_on | length == 0
    fail_msg: >-
      EEE is still enabled on {{ wired_link_on | join(', ') }}.

      Low Power Idle wake transitions drop packets, a dropped packet in an idle
      stream has no duplicate ACKs to trigger fast retransmit, and the resulting
      timeout backs off exponentially — so a sub-millisecond hardware event is
      felt as a terminal that freezes for several seconds and then catches up all
      at once. Throughput tests will not show it, because a saturated link never
      goes idle.

      Check: systemctl status eee-off@<iface>, and whether the link renegotiated
      after the unit last ran — a reseated cable or a switch reboot is enough.
    success_msg: "EEE off: {{ wired_link_managed | join(', ') }}"
  vars:
    # Only "enabled" fails ("not supported" has nothing to suppress). Anchored on
    # the status line, since the advertised-modes block below also says enabled.
    wired_link_on: >-
      {{ wired_link_state.results
         | selectattr('stdout', 'search', '(?i)EEE status:\s*enabled')
         | map(attribute='item') | list }}

# The kernel's own control, not the unit's state. A NIC with no link/l1_aspm
# file is not PCIe-attached and has no ASPM to check, so a failed read skips it.
- name: Read the ASPM L1 state of each interface's link
  ansible.builtin.command: "cat /sys/class/net/{{ item }}/device/link/l1_aspm"
  register: wired_link_aspm
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ wired_link_managed }}"
  loop_control:
    label: "{{ item }}"

- name: Assert ASPM L1 is off on every PCIe-attached wired interface
  ansible.builtin.assert:
    that:
      - wired_link_aspm_on | length == 0
    fail_msg: >-
      ASPM L1 is still enabled on the link to {{ wired_link_aspm_on | join(', ') }}.

      An Intel I225 or I226 can fail to wake from L1, and the kernel logs "PCIe
      link lost, device now detached". The interface is then gone until a
      reboot, while the switch may still show the port up at a low speed.

      Check: systemctl status aspm-l1-off@<iface>, and `lspci -vv` on the NIC
      for "ASPM L1 Enabled" under LnkCtl.
    success_msg: >-
      ASPM L1 off: {{ wired_link_aspm.results | selectattr('rc', 'equalto', 0)
      | map(attribute='item') | join(', ') or 'no PCIe-attached interfaces' }}
  vars:
    wired_link_aspm_on: >-
      {{ wired_link_aspm.results
         | selectattr('rc', 'equalto', 0)
         | rejectattr('stdout', 'equalto', '0')
         | map(attribute='item') | list }}
